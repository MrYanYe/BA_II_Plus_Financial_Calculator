<style data-source="styles.css">
/* ── Reset & Base ───────────────────────────────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --body-bg: #252525;
  --calc-bg: #333;
  --calc-edge: #1c1c1c;

  --lcd-bg: #8fa87a;
  --lcd-shade: #6e8a5a;
  --lcd-text: #141e0c;
  --lcd-dim: #3a5028;

  --key-bg: #4a4a4a;
  --key-hi: #585858;
  --key-shadow: #1a1a1a;

  --key-tvm-bg: #404040;
  --key-mem-bg: #3d4f5a;
  --key-op-bg: #3a3a3a;
  --key-eq-bg: #5a3e14;
  --key-func-bg: #2a4050;
  --key-nav-bg: #383838;
  --key-2nd-bg: #7a6010;
  --key-2nd-act: #c8a030;
  --key-clr-bg: #3a3030;
  --key-num-bg: #484848;
  --key-math-bg: #424242;

  --sec-color: #f5c400;
  --pri-color: #f0f0f0;

  --ws-bg: #1e2e3a;
  --ws-border: #2d4556;

  --accent: #4ac0a0;
  --danger: #e05050;
}

html {
  scroll-behavior: smooth;
}

body {
  height: 100%;
  background: var(--body-bg);
  font-family: 'Space Grotesk', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

/* ── App Shell ──────────────────────────────────────── */
.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Navbar ─────────────────────────────────────────── */
.navbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(30, 30, 30, 0.8);
  backdrop-filter: blur(15px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  height: 70px;
  display: flex;
  align-items: center;
}

.nav-container {
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  padding: 0 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 1.5rem;
  font-weight: 800;
  color: #fff;
  text-decoration: none;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.nav-logo {
  height: 32px;
  width: auto;
  border-radius: 6px;
}

.footer-logo {
  height: 36px;
  width: auto;
  border-radius: 8px;
}

.logo span {
  color: var(--sec-color);
  font-weight: 400;
}

.nav-links {
  display: flex;
  gap: 2.5rem;
  list-style: none;
}

.nav-links a {
  color: #fff;
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 500;
  transition: color 0.3s ease;
}

.nav-links a:hover {
  color: var(--sec-color);
}

.nav-cta {
  background: var(--sec-color);
  color: #000;
  border: none;
  padding: 0.6rem 1.2rem;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.2s ease, filter 0.2s ease;
}

.nav-cta:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
}

/* ── Hero Area ──────────────────────────────────────── */
.hero-area {
  padding: 4rem 1rem 3.5rem 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2.5rem;
  background: radial-gradient(circle at center, #333 0%, #252525 100%);
}

/* ── Other Calculators Slider Section ── */
.other-calculators-section {
  background: transparent;
  width: 100%;
  position: relative;
  overflow: hidden;
}

.calc-slider-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
}

.calc-slider-track {
  display: flex;
  gap: 1.5rem;
  overflow-x: auto;
  scroll-behavior: smooth;
  scroll-snap-type: x mandatory;
  padding: 0.75rem 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  -ms-overflow-style: none;
  justify-content: flex-start;
  max-width: 840px;
  width: 100%;
}

.calc-slider-track::-webkit-scrollbar {
  display: none;
}

.calc-card {
  flex: 0 0 264px;
  width: 264px;
  scroll-snap-align: start;
  background: linear-gradient(145deg, #2a2a2a, #202020);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  padding: 1rem 1.4rem;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  text-align: left;
  gap: 1rem;
  text-decoration: none;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
  cursor: pointer;
  user-select: none;
}

.calc-card:hover {
  transform: translateY(-4px);
  border-color: var(--sec-color);
  background: linear-gradient(145deg, #323232, #262626);
  box-shadow: 0 10px 25px rgba(255, 182, 0, 0.15);
}

.calc-card-icon {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  background: rgba(255, 182, 0, 0.1);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--sec-color);
  transition: all 0.3s ease;
  border: 1px solid rgba(255, 182, 0, 0.15);
}

.calc-card:hover .calc-card-icon {
  background: var(--sec-color);
  color: #000;
  transform: scale(1.06);
  box-shadow: 0 0 16px rgba(255, 182, 0, 0.4);
}

.calc-card-title {
  color: #f0f0f0;
  font-size: 0.95rem;
  font-weight: 700;
  line-height: 1.3;
  transition: color 0.3s ease;
  white-space: nowrap;
}

.calc-card:hover .calc-card-title {
  color: #ffffff;
}

.slider-arrow {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(42, 42, 42, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  z-index: 2;
}

.slider-arrow:hover {
  background: var(--sec-color);
  color: #000;
  border-color: var(--sec-color);
  transform: scale(1.08);
}

@media (max-width: 640px) {
  .calc-slider-track {
    justify-content: flex-start;
  }
  .slider-arrow {
    display: none;
  }
  .calc-card {
    flex: 0 0 210px;
    width: 210px;
    min-width: 210px;
    padding: 0.85rem 1rem;
    gap: 0.75rem;
  }
  .calc-card-icon {
    width: 38px;
    height: 38px;
  }
  .calc-card-icon svg {
    width: 20px;
    height: 20px;
  }
  .calc-card-title {
    font-size: 0.88rem;
  }
}

/* ── Page Content ───────────────────────────────────── */
.section-block {
  padding: 8rem 1.5rem;
}

.alt-bg {
  background: #1e1e1e;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

.section-header h1,
.section-header h2,
.section-block h2 {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 800;
  color: #fff;
  line-height: 1.2;
  margin-bottom: 1.5rem;
  text-align: center;
  background: linear-gradient(135deg, #fff 0%, #888 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.intro-main-cta {
  text-align: center;
  margin-bottom: 4rem;
  padding: 3rem 2rem;
  background: radial-gradient(circle at center, rgba(255, 182, 0, 0.03), transparent 70%);
  border-radius: 40px;
}

.intro-main-cta h1 {
  font-size: clamp(2rem, 5vw, 2.8rem);
  font-weight: 800;
  color: #fff !important;
  margin-bottom: 1.8rem;
  line-height: 1.2;
  letter-spacing: -1px;
  -webkit-text-fill-color: initial !important;
  background: none !important;
}

.cta-button-main {
  display: inline-block;
  background: var(--sec-color);
  color: #000;
  padding: 1rem 3rem;
  border-radius: 100px;
  font-weight: 700;
  font-size: 1.05rem;
  text-decoration: none;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 10px 20px rgba(255, 182, 0, 0.15);
}

.cta-button-main:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 20px 40px rgba(255, 182, 0, 0.3);
  background: #fff;
}

.section-subtitle {
  text-align: center;
  max-width: 800px;
  margin: 0 auto 4rem;
  color: #71717a;
  font-size: 1.1rem;
  line-height: 1.6;
}

.grid-layout {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 4rem;
  align-items: center;
}

.text-content {
  padding-left: 8rem;
}

.text-content p {
  font-size: 1.15rem;
  color: #a1a1aa;
  line-height: 1.8;
}

/* ── Features Section ──────────────────────────────── */
.features-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2.5rem;
  margin-top: 2rem;
}

.feature-card {
  position: relative;
  background: linear-gradient(145deg, #2a2a2a, #222);
  padding: 3rem 2rem;
  border-radius: 24px;
  border: 1px solid rgba(255, 255, 255, 0.03);
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.feature-card:hover {
  transform: translateY(-12px);
  border-color: rgba(255, 182, 0, 0.3);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}

.feature-icon-wrapper {
  width: 80px;
  height: 80px;
  background: rgba(255, 182, 0, 0.15);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 2rem;
  transition: all 0.4s ease;
  color: var(--sec-color);
}

.feature-icon-wrapper svg {
  filter: drop-shadow(0 0 8px rgba(255, 182, 0, 0.4));
}

.feature-card:hover .feature-icon-wrapper {
  transform: scale(1.1) rotate(5deg);
  background: var(--sec-color);
  color: #000;
  box-shadow: 0 0 25px rgba(255, 182, 0, 0.3);
}

.feature-card h3 {
  color: #fff;
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 1rem;
}

.feature-card p {
  color: #a1a1aa;
  font-size: 1rem;
  line-height: 1.6;
}

/* ── Split Layout (Stand Out Section) ─────────────── */
.split-layout {
  display: grid;
  grid-template-columns: 0.8fr 1.2fr;
  gap: 5rem;
  align-items: center;
  margin-top: 3rem;
}

.split-visual {
  max-width: 420px;
  justify-self: center;
}

.split-visual img {
  width: 100%;
  border-radius: 30px;
  box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
}

.split-content {
  display: flex;
  flex-direction: column;
  gap: 2.5rem;
}

.standout-item {
  display: flex;
  gap: 1.5rem;
  align-items: flex-start;
}

.item-icon {
  width: 54px;
  height: 54px;
  background: var(--sec-color);
  color: #000;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  flex-shrink: 0;
  box-shadow: 0 10px 20px rgba(255, 182, 0, 0.2);
}

.item-text h3 {
  color: #fff;
  font-size: 1.25rem;
  margin-bottom: 0.5rem;
}

.item-text p {
  color: #a1a1aa;
  font-size: 1rem;
  line-height: 1.6;
}

/* ── Guide Section ────────────────────────────────── */
.guide-container {
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

.guide-step-card {
  background: #252525;
  border-radius: 20px;
  padding: 2.5rem;
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 2rem;
  align-items: center;
  border: 1px solid rgba(255, 255, 255, 0.05);
  transition: border-color 0.3s ease;
}

.guide-step-card:hover {
  border-color: var(--sec-color);
}

.step-badge {
  width: 80px;
  height: 80px;
  background: #333;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--sec-color);
  border: 2px solid rgba(255, 182, 0, 0.2);
}

.step-info h4 {
  color: #fff;
  font-size: 1.25rem;
  margin-bottom: 0.5rem;
}

.step-info p {
  color: #a1a1aa;
  font-size: 1.1rem;
  line-height: 1.6;
}

/* ── Advanced Grid ────────────────────────────────── */
.advanced-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 2rem;
  margin-top: 2rem;
}

.adv-card {
  background: linear-gradient(145deg, #2a2a2a, #242424);
  padding: 2.5rem;
  border-radius: 24px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.adv-card:hover {
  transform: translateY(-8px);
  border-color: var(--sec-color);
  box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
}

.adv-icon {
  font-size: 2rem;
  margin-bottom: 1.5rem;
  display: block;
  color: var(--sec-color);
}

.adv-icon svg {
  filter: drop-shadow(0 0 10px rgba(255, 182, 0, 0.5));
}

.adv-card h3 {
  color: #fff;
  font-size: 1.3rem;
  margin-bottom: 1rem;
}

.adv-card p {
  color: #a1a1aa;
  font-size: 1rem;
  line-height: 1.6;
}

.adv-card::after {
  content: "";
  position: absolute;
  bottom: 0;
  right: 0;
  width: 60px;
  height: 60px;
  background: radial-gradient(circle at bottom right, rgba(255, 182, 0, 0.1), transparent);
  pointer-events: none;
}

/* ── Testimonials Section ─────────────────────────── */
.testimonials-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 2.5rem;
  margin-top: 3rem;
}

.testimonial-card {
  background: #262626;
  padding: 3rem 2.5rem;
  border-radius: 28px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  position: relative;
}

.testimonial-card:hover {
  transform: translateY(-12px);
  background: #2d2d2d;
  border-color: rgba(255, 182, 0, 0.4);
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 182, 0, 0.05);
}

.stars {
  color: var(--sec-color);
  font-size: 1.1rem;
  letter-spacing: 3px;
  filter: drop-shadow(0 0 5px rgba(255, 182, 0, 0.3));
}

.user-profile {
  display: flex;
  align-items: center;
  gap: 1.2rem;
}

.user-avatar {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255, 182, 0, 0.2);
}

.user-info strong {
  color: #fff;
  font-size: 1.2rem;
  font-weight: 800;
  margin-bottom: 0.2rem;
  display: block;
}

.user-info span {
  color: #888;
  font-size: 0.9rem;
  display: block;
  font-weight: 500;
}

.testimonial-card p {
  color: #d4d4d8;
  font-style: italic;
  font-size: 1.05rem;
  line-height: 1.8;
  position: relative;
}


/* ── CTA Section ─────────────────────────────────── */
.cta-section {
  padding-bottom: 10rem;
}

.cta-banner {
  background: linear-gradient(135deg, #2a2a2a 0%, #151515 100%);
  border-radius: 40px;
  padding: 6rem 4rem;
  text-align: center;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.05);
  box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
}

.cta-banner::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -20%;
  width: 150%;
  height: 200%;
  background: radial-gradient(circle at center, rgba(255, 182, 0, 0.04), transparent 70%);
  pointer-events: none;
}

.cta-content h2 {
  font-size: clamp(2.5rem, 5vw, 3.5rem);
  color: #fff;
  font-weight: 900;
  margin-bottom: 1.5rem;
  background: linear-gradient(135deg, #fff 0%, var(--sec-color) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.cta-content p {
  color: #a1a1aa;
  font-size: 1.25rem;
  max-width: 700px;
  margin: 0 auto 3rem;
  line-height: 1.7;
}

.cta-button {
  display: inline-block;
  background: var(--sec-color);
  color: #000;
  padding: 1.4rem 4rem;
  border-radius: 100px;
  font-weight: 800;
  font-size: 1.15rem;
  text-decoration: none;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 15px 30px rgba(255, 182, 0, 0.2);
}

.cta-button:hover {
  transform: translateY(-8px) scale(1.05);
  box-shadow: 0 25px 50px rgba(255, 182, 0, 0.4);
  background: #fff;
}

/* ── Footer ─────────────────────────────────────────── */
.site-footer {
  background: #1a1a1a;
  padding: 4rem 1.5rem 2rem;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 4rem;
  margin-bottom: 4rem;
}

.footer-brand p {
  color: #6b7280;
  margin-top: 1rem;
}

.footer-links strong,
.footer-legal strong {
  color: #fff;
  margin-bottom: 1.5rem;
  display: block;
}

.footer-links ul,
.footer-legal ul {
  list-style: none;
}

.footer-links li,
.footer-legal li {
  margin-bottom: 0.75rem;
}

.footer-links a,
.footer-legal a {
  color: #6b7280;
  text-decoration: none;
  transition: color 0.2s ease;
}

.footer-links a:hover,
.footer-legal a:hover {
  color: #fff;
}

.footer-bottom {
  text-align: center;
  padding-top: 2rem;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  color: #4b5563;
  font-size: 0.9rem;
}

/* ── Content Media ──────────────────────────────────── */
.content-image {
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  max-width: 450px;
  margin: 0 auto;
}

.content-image img {
  width: 100%;
  display: block;
}

.image-caption {
  background: #222;
  color: #6b7280;
  font-size: 0.85rem;
  padding: 1rem;
  text-align: center;
}

@media (max-width: 900px) {

  .grid-layout,
  .features-grid,
  .guide-steps,
  .content-columns,
  .footer-grid {
    grid-template-columns: 1fr;
  }
}

.calculator {
  width: min(420px, 100%);
  background: linear-gradient(175deg, #3d3d3d, #2a2a2a);
  border: 2px solid var(--calc-edge);
  border-radius: 18px;
  padding: 14px 14px 18px;
  box-shadow:
    0 4px 0 1px #111,
    0 30px 60px rgba(0, 0, 0, .65),
    inset 0 1px 0 rgba(255, 255, 255, .07);
}

@media (max-width: 480px) {
  .calculator {
    border-radius: 0;
    border: none;
    min-height: 100vh;
    padding: 10px 10px 14px;
  }
}

/* ── LCD Display ────────────────────────────────────── */
.display {
  background: linear-gradient(180deg, #9db889 0%, #7e9e6a 100%);
  border: 3px solid var(--lcd-shade);
  border-radius: 8px;
  padding: 10px 14px 12px;
  margin-bottom: 12px;
  box-shadow:
    inset 0 2px 6px rgba(0, 0, 0, .3),
    0 1px 0 rgba(255, 255, 255, .08);
  position: relative;
}

.display-status {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--lcd-dim);
  font-weight: 700;
  text-transform: uppercase;
  min-height: 14px;
  margin-bottom: 4px;
}

.display-expr {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--lcd-dim);
  text-align: right;
  min-height: 14px;
  letter-spacing: 0.04em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.display-screen {
  display: block;
  width: 100%;
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(2rem, 9vw, 2.6rem);
  font-weight: 400;
  text-align: right;
  color: var(--lcd-text);
  letter-spacing: 0.06em;
  line-height: 1.1;
  word-break: break-all;
}

/* ── Worksheets ─────────────────────────────────────── */
.worksheet {
  background: var(--ws-bg);
  border: 1px solid var(--ws-border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 11px;
  animation: slideDown 180ms ease;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.ws-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.ws-title {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--sec-color);
  text-transform: uppercase;
}

.ws-close {
  background: none;
  border: none;
  color: #888;
  font-size: 1rem;
  cursor: pointer;
  line-height: 1;
  padding: 0 2px;
}

.ws-close:hover {
  color: #fff;
}

.ws-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-bottom: 9px;
}

.ws-field {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.ws-field--full {
  grid-column: 1 / -1;
}

.ws-label {
  font-size: 0.72rem;
  font-weight: 600;
  color: #a8c0cc;
  letter-spacing: 0.03em;
}

.ws-hint {
  font-size: 0.65rem;
  font-weight: 400;
  color: #607080;
  margin-left: 4px;
}

.ws-field input,
.cf-row input {
  background: rgba(0, 0, 0, .35);
  border: 1px solid #2d4556;
  border-radius: 5px;
  color: #e8f4f0;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.9rem;
  padding: 5px 8px;
  width: 100%;
  -moz-appearance: textfield;
}

.ws-field input::-webkit-outer-spin-button,
.ws-field input::-webkit-inner-spin-button,
.cf-row input::-webkit-outer-spin-button,
.cf-row input::-webkit-inner-spin-button {
  -webkit-appearance: none;
}

.ws-field input:focus,
.cf-row input:focus {
  outline: 2px solid rgba(74, 192, 160, .4);
  border-color: transparent;
}

.ws-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 6px;
}

.ws-btn {
  background: linear-gradient(180deg, #1e4060, #142d44);
  border: 1px solid #2d5070;
  border-radius: 6px;
  color: #c8e8f8;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.76rem;
  font-weight: 700;
  padding: 7px 4px;
  cursor: pointer;
  text-align: center;
  transition: filter 100ms;
}

.ws-btn:hover {
  filter: brightness(1.15);
}

.ws-btn:active {
  filter: brightness(0.9);
}

.ws-btn--wide {
  grid-column: span 2;
}

.ws-btn--green {
  background: linear-gradient(180deg, #1a5040, #0e3028);
  border-color: #2a7060;
  color: #88e8c8;
}

.ws-btn--add {
  width: 100%;
  margin-top: 8px;
  background: linear-gradient(180deg, #2a3840, #1a2830);
  border-color: #3a5060;
  color: #88aabb;
  font-size: 0.78rem;
}

.ws-note {
  font-size: 0.66rem;
  color: #506070;
  margin-top: 7px;
  line-height: 1.4;
}

/* CF panel */
.cf-top {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: end;
  margin-bottom: 10px;
}

.cf-cpt-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.cf-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-height: 200px;
  overflow-y: auto;
}

.cf-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 5px;
  align-items: center;
}

.cf-row-label {
  font-size: 0.7rem;
  font-weight: 700;
  color: #7090a0;
  white-space: nowrap;
}

.cf-row-freq {
  display: flex;
  align-items: center;
  gap: 3px;
}

.cf-row-freq label {
  font-size: 0.65rem;
  color: #506070;
}

.cf-row-freq input {
  width: 44px !important;
}

.cf-remove {
  background: none;
  border: none;
  color: #604040;
  font-size: 1rem;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}

.cf-remove:hover {
  color: var(--danger);
}

/* ── Register Overlay ───────────────────────────────── */
.register-overlay {
  background: linear-gradient(175deg, #1a2f3f, #111e28);
  border: 1px solid #2a4050;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 11px;
  animation: slideDown 150ms ease;
}

.reg-title {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--sec-color);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.reg-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  margin-bottom: 8px;
}

.reg-btn {
  background: linear-gradient(180deg, #243444, #18262e);
  border: 1px solid #2d4050;
  border-radius: 6px;
  color: #c8e0ec;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem;
  padding: 6px 2px;
  cursor: pointer;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.reg-btn:hover {
  border-color: var(--accent);
  color: #fff;
}

.reg-btn-num {
  font-size: 0.95rem;
  font-weight: 700;
  color: #fff;
}

.reg-btn-val {
  font-size: 0.6rem;
  color: #7090a0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 48px;
}

.reg-cancel {
  width: 100%;
  background: none;
  border: 1px solid #2a3540;
  border-radius: 5px;
  color: #607080;
  font-size: 0.75rem;
  padding: 5px;
  cursor: pointer;
}

.reg-cancel:hover {
  color: #aaa;
  border-color: #404f60;
}

/* ── Keypad ─────────────────────────────────────────── */
.keypad {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.krow {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}

.krow-last {
  grid-template-columns: repeat(4, 1fr);
}

/* ── Key base ───────────────────────────────────────── */
.key {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 0 2px 6px;
  height: 54px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  position: relative;
  box-shadow: 0 3px 0 var(--key-shadow);
  transition: transform 80ms ease, filter 80ms ease;
  background: linear-gradient(180deg, var(--key-hi) 0%, var(--key-bg) 100%);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.key:hover {
  filter: brightness(1.12);
}

.key:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--key-shadow);
  filter: brightness(0.9);
}

/* secondary label */
.ks {
  font-size: 8.5px;
  font-weight: 700;
  color: var(--sec-color);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  line-height: 1;
  position: absolute;
  top: 6px;
  white-space: nowrap;
  pointer-events: none;
}

/* primary label */
.kp {
  font-size: 15px;
  font-weight: 700;
  color: var(--pri-color);
  line-height: 1;
  pointer-events: none;
  font-family: 'Space Grotesk', sans-serif;
}

/* ── Key type variants ──────────────────────────────── */
.key-nav {
  --key-bg: var(--key-nav-bg);
  --key-hi: #484848;
}

.key-tvm {
  --key-bg: var(--key-tvm-bg);
  --key-hi: #505050;
}

.key-math {
  --key-bg: var(--key-math-bg);
  --key-hi: #525252;
}

.key-op {
  --key-bg: var(--key-op-bg);
  --key-hi: #484848;
}

.key-num {
  --key-bg: var(--key-num-bg);
  --key-hi: #585858;
}

.key-func {
  --key-bg: var(--key-func-bg);
  --key-hi: #345060;
  border: 1px solid #2d5070;
}

.key-mem {
  --key-bg: var(--key-mem-bg);
  --key-hi: #4d6070;
}

.key-eq {
  --key-bg: var(--key-eq-bg);
  --key-hi: #6a4a18;
}

.key-clr {
  --key-bg: var(--key-clr-bg);
  --key-hi: #4a3838;
}

/* 2ND key */
.key-2nd {
  --key-bg: var(--key-2nd-bg);
  --key-hi: #907020;
}

.key-2nd .kp {
  color: #fff8e0;
  font-size: 16px;
}

.key-2nd.active {
  --key-bg: var(--key-2nd-act);
  --key-hi: #d8b040;
  box-shadow: 0 3px 0 #5a4000, 0 0 10px rgba(200, 160, 48, .5);
}

.key-2nd.active .kp {
  color: #fff;
}

/* ── Responsive ─────────────────────────────────────── */
@media (max-width: 380px) {
  .key {
    height: 48px;
  }

  .kp {
    font-size: 13px;
  }

  .ks {
    font-size: 8px;
  }

  .keypad {
    gap: 4px;
  }

  .krow {
    gap: 4px;
  }

  .display-screen {
    font-size: 1.9rem;
  }
}

@media (min-width: 600px) {
  .key {
    height: 58px;
  }

  .kp {
    font-size: 16px;
  }
}

<!-- Centring + any other offline-only adjustments. See the file for rationale. -->
<style data-source="offline_overrides.css">
/* ─────────────────────────────────────────────────────────────────────────
   offline_overrides.css
   ─────────────────────────────────────────────────────────────────────────
   The only stylesheet in this project that is NOT taken verbatim from
   baiiplusfinancialcalculator.com. styles.css is upstream, byte-for-byte, and
   is what makes the calculator look identical. This file sits after it and
   carries just the adjustments that only make sense for a standalone page.

   Two changes, both explained below. Everything else is upstream.
   ───────────────────────────────────────────────────────────────────────── */


/* 1. Vertical centring.
   ─────────────────────────────────────────────────────────────────────────
   Upstream the widget sits at the top of the page because a navbar precedes it
   and five marketing sections follow. Offline there is nothing above or below,
   so the device is centred in the viewport instead.

   .app-shell is already `min-height: 100vh; display: flex; flex-direction:
   column`, so one property is enough to centre its only child.

   `safe center` matters: the widget is ~672px tall with a worksheet panel open,
   so on a 768px-tall laptop it overflows. Plain `center` would push the top of
   the device out of reach -- the overflow goes above the scroll origin and
   cannot be scrolled back to. `safe center` degrades to start alignment in that
   case so everything stays reachable. The plain `center` line above it is the
   fallback for browsers without `safe` support. */
.app-shell {
  min-height: 100vh;
  min-height: 100dvh;          /* dvh tracks mobile URL-bar collapse */
  justify-content: center;     /* fallback */
  justify-content: safe center;
}


/* 2. Trim the hero padding while centring.
   ─────────────────────────────────────────────────────────────────────────
   Upstream is `4rem 1rem 3.5rem 1rem`, sized for a page that has a navbar
   above it. 7.5rem of vertical padding pushes the ~672px device past the fold
   on a 1366x768 screen, which would defeat the centring (safe center would
   fall back to top-aligned and it would scroll). 2.5rem keeps generous
   breathing room while letting the device fit and actually centre on common
   laptop screens. Horizontal padding is untouched. */
.hero-area {
  padding: 2.5rem 1rem;
}




/* 3. Move the worksheet panels outside the device.
   ─────────────────────────────────────────────────────────────────────────
   Upstream, opening TVM / CF / STO-RCL expands a panel between the display and
   the keypad, so the device grows downwards and the keypad is pushed off-screen.
   Here the panels sit outside the device entirely -- to its left when there is
   room, below it when there is not -- and the device itself never moves.

   The device needs `position: relative` for the dock to be positioned against
   it. Upstream sets neither position nor overflow on .calculator, so an
   absolutely positioned child was already free to render outside it.

   Because the dock is absolutely positioned it is taken out of flow, which is
   what keeps the device pinned: adding a panel changes nothing about the
   device's own box. */
.calculator {
  position: relative;
}

/* The dock is where the three panels stack. Upstream they are siblings in
   normal flow, so opening a second panel just pushes the first down. Inside a
   flex column that behaviour is preserved exactly: same order, same spacing,
   and never an overlap. */
.panel-dock {
  position: absolute;
  top: calc(100% + 20px);   /* below the whole device */
  left: 0;
  right: 0;                 /* match the device's width */
  display: flex;
  flex-direction: column;
  gap: 11px;                /* upstream's .worksheet margin-bottom */
  margin: 0;
}

/* The panels carried margin-bottom for their in-flow life; the dock's gap
   replaces it, otherwise every pair would be 22px apart instead of 11px. */
.panel-dock > .worksheet,
.panel-dock > .register-overlay {
  margin-bottom: 0;
}

/* Beside the device when there is genuinely room.

   The width is not arbitrary. The device is 420px and the page adds 2rem of
   side padding, so a centred device has (100vw - 32 - 420) / 2 of space on each
   side. A 300px dock plus a 20px gap needs 320px a side:

       420 + 2 * 320 + 32 = 1092px

   1120px leaves a little slack. `orientation: landscape` covers the portrait
   case explicitly, where the request was to stack regardless of width.

   Media queries re-evaluate on every resize, so dragging the window across the
   threshold switches modes live with no JavaScript. */
@media (orientation: landscape) and (min-width: 1120px) {
  .panel-dock {
    top: 0;                    /* top-aligned with the device */
    right: calc(100% + 20px);  /* out to its left */
    left: auto;
    width: 300px;
  }
}


/* 4. Phones.
   ─────────────────────────────────────────────────────────────────────────
   Upstream already switches the device to a full-bleed, `min-height: 100vh`
   panel at <=480px -- no border, no rounding, edge to edge. That is a
   deliberate mobile design and is kept as-is. The hero padding just has to go,
   otherwise the device is pushed off the bottom of the screen, and centring is
   meaningless for something already viewport-height. */
@media (max-width: 480px) {
  .hero-area {
    /* Vertical padding goes; the horizontal gutters stay. Upstream's 1rem side
       padding is what gives the device its 358px width at a 390px viewport --
       dropping it too would stretch the device to a full-bleed 390px and change
       its proportions. Keeping it means the offline device is exactly the width
       the live one is. */
    padding: 0 1rem;
    gap: 0;
  }

  .app-shell {
    justify-content: flex-start;
  }

  /* Phones need the dock reordered rather than positioned.
     ───────────────────────────────────────────────────────────────────────
     Upstream stretches the device to a full screen here (`min-height: 100vh`),
     and the keypad stops well short of the bottom -- 189px short on a 390x844
     phone. Absolute positioning measures from the device's box, not from where
     its content ends, so the dock landed below that dead space: the panel sat
     209px adrift of the keypad while looking properly attached on a desktop,
     where the device is only as tall as its contents.

     Making the device a flex column lets the dock be reordered instead. It is
     already the middle child in the DOM -- display, dock, keypad -- so putting
     it after the keypad with `order` places it directly beneath them, and the
     device's leftover space ends up below the panel rather than between them.

     Nothing visual changes while no panel is open: the children keep their
     normal order and the device stays full-height with the same background. */
  .calculator {
    display: flex;
    flex-direction: column;
  }

  .display {
    order: 1;
  }

  .keypad {
    order: 2;
  }

  .panel-dock {
    order: 3;
    position: static;
    margin-top: 20px;   /* the gap the absolutely positioned version used */
  }
}

</style>

<!-- Upstream calculator logic, copied verbatim. Fully client-side: no fetch,
     no XHR, no storage, no imports. Inlined at build time. -->
<script data-source="script.js">
/* ── State ────────────────────────────────────────────── */
const MEM = Array(10).fill(0);          // STO/RCL registers 0-9
let expression   = "0";                  // current arithmetic expression string
let lastResult   = 0;                    // ANS
let pendingOp    = null;                 // 'sto' | 'rcl' | null
let is2nd        = false;                // 2ND key toggle
let isCpt        = false;                // CPT key toggle for TVM
let isBgn        = false;                // BGN mode toggle (true = BGN, false = END)
let cfEntries    = [{ cf: 0, freq: 1 }]; // CF worksheet entries

// Amortization Worksheet State
let currentMode      = "standard";           // "standard" | "amort" | "bgn" | "py"
let amortP1          = 1;
let amortP2          = 1;
let amortActiveIndex = 0;                    // 0: P1, 1: P2, 2: BAL, 3: PRN, 4: INT
const amortVariables = ["P1", "P2", "BAL", "PRN", "INT"];
let amortInputBuffer = "";

// P/Y and C/Y Settings State
let pyVal            = 1;                    // Payments per year (default = 1)
let cyVal            = 1;                    // Compounding periods per year (default = 1)
let pyActiveIndex    = 0;                    // 0: P/Y, 1: C/Y
let pyInputBuffer    = "";

// Format Settings State
let decVal           = 2;                    // Decimal places (default = 2, 0-8: fixed, 9: floating)
let formatInputBuffer = "";
let formatActiveIndex = 0;                    // 0: DEC, 1: DEG/RAD, 2: US/EUR, 3: Chn/AOS
let calcMode         = "Chn";                // "Chn" (Chain, default) | "AOS" (Algebraic Operating System)
let angleMode        = "DEG";                // "DEG" | "RAD"
let dateMode         = "US";                 // "US" | "EUR"

/* ── DOM Refs ─────────────────────────────────────────── */
const screenEl    = document.getElementById("screen");
const exprEl      = document.getElementById("displayExpr");
const statusLeft  = document.getElementById("statusLeft");
const statusRight = document.getElementById("statusRight");
const btn2nd      = document.getElementById("btn2nd");

const tvmPanel    = document.getElementById("tvmPanel");
const cfPanel     = document.getElementById("cfPanel");
const regOverlay  = document.getElementById("registerOverlay");
const regGrid     = document.getElementById("regGrid");
const regTitle    = document.getElementById("regTitle");

const tvmInputs = {
  n:   document.getElementById("tvmN"),
  iy:  document.getElementById("tvmIY"),
  pv:  document.getElementById("tvmPV"),
  pmt: document.getElementById("tvmPMT"),
  fv:  document.getElementById("tvmFV"),
  py:  document.getElementById("tvmPY"),
  cy:  document.getElementById("tvmCY"),
};

/* ── Display helpers ─────────────────────────────────── */
const fmt = (v) => {
  if (!Number.isFinite(v)) return "Error";
  if (Math.abs(v) >= 1e12 || (v !== 0 && Math.abs(v) < 1e-7))
    return v.toExponential(6);

  let s;
  if (decVal === 9) {
    s = v.toFixed(9).replace(/\.?0+$/, "");
  } else {
    s = v.toFixed(decVal);
  }

  const parts = s.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  let res = parts.join(".");

  const zeroTarget = "0" + (decVal > 0 && decVal !== 9 ? "." + "0".repeat(decVal) : "");
  if (res === "-0" || res === "-" + zeroTarget) {
    res = zeroTarget;
  }
  return res;
};

const setScreen = (val) => { screenEl.textContent = val; };
const setExpr   = (val) => { exprEl.textContent = val; };
const setStatus = (left = "", right = "") => {
  let parts = left.split(" ").filter(p => p !== "");
  if (isBgn && !parts.includes("BGN")) {
    parts.unshift("BGN");
  }
  if (calcMode === "AOS" && !parts.includes("AOS")) {
    parts.unshift("AOS");
  }
  if (is2nd && !parts.includes("2ND")) {
    // Keep 2ND at the very front
    parts.unshift("2ND");
  }
  statusLeft.textContent  = parts.join(" ");
  statusRight.textContent = right;
};

const showError = (msg) => {
  setScreen("Error");
  setExpr(msg);
  setStatus("ERR");
  expression = "0";
};

/* ── 2ND key ────────────────────────────────────────── */
const toggle2nd = () => {
  is2nd = !is2nd;
  btn2nd.classList.toggle("active", is2nd);
  updateDisplay();
};

const consume2nd = () => {
  if (!is2nd) return false;
  is2nd = false;
  btn2nd.classList.remove("active");
  updateDisplay();
  return true;
};

/* ── Chain Mode Arithmetic Evaluator ─────────────────── */
const tokenizeFlat = (str) => {
  const tokens = [];
  let i = 0;
  const s = str.replace(/\s+/g, "");

  while (i < s.length) {
    const isUnaryMinus = s[i] === "-" && (tokens.length === 0 || typeof tokens[tokens.length - 1] === "string");

    if (isUnaryMinus || /^[0-9.]/.test(s[i])) {
      let numStr = "";
      if (isUnaryMinus) {
        numStr += "-";
        i++;
      }
      while (i < s.length && /^[0-9.eE]/.test(s[i])) {
        if ((s[i] === "e" || s[i] === "E") && (s[i + 1] === "+" || s[i + 1] === "-")) {
          numStr += s[i] + s[i + 1];
          i += 2;
        } else {
          numStr += s[i];
          i++;
        }
      }
      const val = parseFloat(numStr);
      if (!Number.isFinite(val)) throw new Error("Invalid number: " + numStr);
      tokens.push(val);
    } else if (s.slice(i, i + 2) === "**") {
      tokens.push("**");
      i += 2;
    } else if (["+", "-", "*", "/"].includes(s[i])) {
      tokens.push(s[i]);
      i++;
    } else {
      throw new Error("Unexpected character: " + s[i]);
    }
  }
  return tokens;
};

const evaluateChainFlat = (tokens) => {
  if (tokens.length === 0) return 0;
  let acc = tokens[0];
  for (let i = 1; i < tokens.length; i += 2) {
    const op = tokens[i];
    const nextVal = tokens[i + 1];
    if (nextVal === undefined || typeof nextVal !== "number") break;
    if (op === "+") acc = acc + nextVal;
    else if (op === "-") acc = acc - nextVal;
    else if (op === "*") acc = acc * nextVal;
    else if (op === "/") {
      if (nextVal === 0) throw new Error("Divide by 0");
      acc = acc / nextVal;
    } else if (op === "**") acc = Math.pow(acc, nextVal);
  }
  return acc;
};

const evaluateChain = (expr) => {
  let s = String(expr).trim();
  if (!s) return 0;
  s = s.replace(/[+\-*/]+$/, "");
  if (!s) return 0;

  const parenRegex = /\(([^()]+)\)/;
  let match;
  let safetyLimit = 50;
  while ((match = parenRegex.exec(s)) && safetyLimit-- > 0) {
    const innerVal = evaluateChain(match[1]);
    s = s.slice(0, match.index) + String(innerVal) + s.slice(match.index + match[0].length);
  }

  const tokens = tokenizeFlat(s);
  return evaluateChainFlat(tokens);
};

/* ── Basic expression builder ───────────────────────── */
const appendValue = (v) => {
  pendingOp = null;

  // In Chn mode, when user enters a binary operator, collapse preceding chain if complete
  if (calcMode === "Chn" && ["+", "-", "*", "/", "**"].includes(v)) {
    const openParens = (expression.match(/\(/g) || []).length;
    const closeParens = (expression.match(/\)/g) || []).length;

    if (/[+\-*/]$/.test(expression) && expression !== "-") {
      expression = expression.replace(/[+\-*/]+$/, v);
      setScreen(expression);
      setExpr("");
      return;
    }

    if (openParens === closeParens && /[0-9.)]$/.test(expression)) {
      try {
        const intermediate = evaluateChain(expression);
        if (Number.isFinite(intermediate)) {
          expression = String(intermediate) + v;
          setScreen(expression);
          setExpr("");
          return;
        }
      } catch {
        // fallback
      }
    }
  }

  // Replace duplicate trailing operators in any mode
  if (["+", "*", "/"].includes(v) && /[+\-*/]$/.test(expression) && expression !== "-") {
    expression = expression.replace(/[+\-*/]+$/, v);
    setScreen(expression);
    setExpr("");
    return;
  }

  if (expression === "0" && v !== ".") expression = v;
  else expression += v;
  setScreen(expression);
  setExpr("");
};

const safeEval = () => {
  try {
    let result;
    if (calcMode === "Chn") {
      result = evaluateChain(expression);
    } else {
      // eslint-disable-next-line no-new-func
      result = Function('"use strict"; return (' + expression + ")")();
    }
    if (!Number.isFinite(result)) throw new Error("Bad expression");
    lastResult = result;
    expression = String(result);
    setScreen(fmt(result));
    setExpr("");
    setStatus("");
  } catch {
    showError("Bad expression");
  }
};

/* ── STO / RCL ───────────────────────────────────────── */
const buildRegGrid = (mode) => {
  regGrid.innerHTML = "";
  MEM.forEach((val, i) => {
    const btn = document.createElement("button");
    btn.className = "reg-btn";
    btn.innerHTML = `<span class="reg-btn-num">${i}</span><span class="reg-btn-val">${fmt(val)}</span>`;
    btn.addEventListener("click", () => {
      if (mode === "sto") {
        const num = parseFloat(expression);
        MEM[i] = Number.isFinite(num) ? num : 0;
        setStatus(``, `STO ${i} ✓`);
        setExpr(`Stored to register ${i}`);
      } else {
        expression = String(MEM[i]);
        setScreen(fmt(MEM[i]));
        setExpr(`Recalled register ${i}`);
        setStatus("", `RCL ${i}`);
      }
      regOverlay.hidden = true;
      pendingOp = null;
    });
    regGrid.appendChild(btn);
  });
};

const openRegOverlay = (mode) => {
  pendingOp = mode;
  regTitle.textContent = mode === "sto"
    ? "STO — select register (0–9)"
    : "RCL — select register (0–9)";
  buildRegGrid(mode);
  regOverlay.hidden = false;
};

document.getElementById("regCancel").addEventListener("click", () => {
  regOverlay.hidden = true;
  pendingOp = null;
});

/* ── TVM solver ──────────────────────────────────────── */
const tvmVal = (id) => {
  const raw = tvmInputs[id].value.trim().replace(/,/g, "");
  if (raw === "") return null;
  const n = Number(raw);
  return Number.isFinite(n) ? n : null;
};

const bisect = (fn, lo, hi, itr = 150, tol = 1e-9) => {
  let fLo = fn(lo), fHi = fn(hi);
  if (fLo === 0) return lo;
  if (fHi === 0) return hi;
  for (let e = 0; e < 15 && fLo * fHi > 0; e++) {
    lo = Math.max(-0.9999, lo - 1);
    hi += 1;
    fLo = fn(lo); fHi = fn(hi);
  }
  if (fLo * fHi > 0) return null;
  for (let i = 0; i < itr; i++) {
    const mid = (lo + hi) / 2;
    const fMid = fn(mid);
    if (Math.abs(fMid) < tol) return mid;
    fLo * fMid < 0 ? (hi = mid, fHi = fMid) : (lo = mid, fLo = fMid);
  }
  return (lo + hi) / 2;
};

/* ── P/Y & C/Y Rate Conversion Helpers ───────────────── */
const getRatePerPeriod = (iy) => {
  const nominalRate = iy / 100;
  if (Math.abs(pyVal - cyVal) < 1e-12) {
    return nominalRate / pyVal;
  } else {
    return Math.pow(1 + nominalRate / cyVal, cyVal / pyVal) - 1;
  }
};

const getIyFromRate = (r) => {
  if (Math.abs(pyVal - cyVal) < 1e-12) {
    return r * pyVal * 100;
  } else {
    return cyVal * 100 * (Math.pow(1 + r, pyVal / cyVal) - 1);
  }
};

/* ── Amortization worksheet calculations & UI updates ── */
const calculateAmort = () => {
  const parseVal = (str) => {
    if (!str) return 0;
    return parseFloat(str.replace(/,/g, "")) || 0;
  };

  const pvVal = parseVal(tvmInputs.pv.value);
  let pmtVal = parseVal(tvmInputs.pmt.value);
  const iyVal = parseVal(tvmInputs.iy.value);
  const nVal = parseVal(tvmInputs.n.value);
  const fvVal = parseVal(tvmInputs.fv.value);

  const r = getRatePerPeriod(iyVal);
  const p1 = Math.max(1, Math.round(amortP1));
  const p2 = Math.max(p1, Math.round(amortP2));

  // Use unrounded exact PMT if pmtVal aligns with TVM inputs
  if (nVal > 0 && Math.abs(pvVal) > 0 && Math.abs(r) >= 0) {
    const pmtExact = Math.abs(r) < 1e-12
      ? -(pvVal + fvVal) / nVal
      : -((pvVal * Math.pow(1 + r, nVal) + fvVal) * r) / ((Math.pow(1 + r, nVal) - 1) * (isBgn ? (1 + r) : 1));
    if (Number.isFinite(pmtExact) && (pmtVal === 0 || Math.abs(pmtVal - Math.round(pmtExact * 100) / 100) < 0.05)) {
      pmtVal = pmtExact;
    }
  }

  let balance = pvVal;
  let accumulatedPrn = 0;
  let accumulatedInt = 0;

  for (let t = 1; t <= p2; t++) {
    let interest, principal;
    if (isBgn) {
      interest = - ((balance + pmtVal) * r);
      principal = pmtVal - interest;
      balance = balance + pmtVal + interest;
    } else {
      interest = - (balance * r);
      principal = pmtVal - interest;
      balance = balance + principal;
    }

    if (t >= p1) {
      accumulatedPrn += principal;
      accumulatedInt += interest;
    }
  }

  const round2 = (val) => Math.round(val * 100) / 100;

  return {
    bal: round2(balance),
    prn: round2(accumulatedPrn),
    int: round2(accumulatedInt)
  };
};

const updateDisplay = () => {
  let sLeftParts = [];
  if (is2nd) sLeftParts.push("2ND");
  if (isBgn) sLeftParts.push("BGN");
  if (calcMode === "AOS") sLeftParts.push("AOS");

  // Keep worksheet P/Y and C/Y inputs in sync
  if (tvmInputs.py) tvmInputs.py.value = fmt(pyVal);
  if (tvmInputs.cy) tvmInputs.cy.value = fmt(cyVal);

  if (currentMode === "amort") {
    sLeftParts.push("AMORT");
    setStatus(sLeftParts.join(" "), "");

    const varName = amortVariables[amortActiveIndex];
    setExpr(varName + " =");

    if (varName === "P1") {
      setScreen(amortInputBuffer !== "" ? amortInputBuffer : amortP1.toFixed(2));
    } else if (varName === "P2") {
      setScreen(amortInputBuffer !== "" ? amortInputBuffer : amortP2.toFixed(2));
    } else {
      const res = calculateAmort();
      if (varName === "BAL") setScreen(fmt(res.bal));
      else if (varName === "PRN") setScreen(fmt(res.prn));
      else if (varName === "INT") setScreen(fmt(res.int));
    }
  } else if (currentMode === "bgn") {
    setStatus(sLeftParts.join(" "), "");
    setExpr("SETTING");
    setScreen(isBgn ? "BGN" : "END");
  } else if (currentMode === "py") {
    setStatus(sLeftParts.join(" "), "");
    const varName = pyActiveIndex === 0 ? "P/Y" : "C/Y";
    setExpr(varName + " =");
    const currentVal = pyActiveIndex === 0 ? pyVal : cyVal;
    setScreen(pyInputBuffer !== "" ? pyInputBuffer : currentVal.toFixed(2));
  } else if (currentMode === "format") {
    setStatus(sLeftParts.join(" "), "FORMAT");
    if (formatActiveIndex === 0) {
      setExpr("DEC =");
      setScreen(formatInputBuffer !== "" ? formatInputBuffer : decVal.toString());
    } else if (formatActiveIndex === 1) {
      setExpr("DEG / RAD =");
      setScreen(angleMode);
    } else if (formatActiveIndex === 2) {
      setExpr("FORMAT =");
      setScreen(dateMode);
    } else if (formatActiveIndex === 3) {
      setExpr("CALC METHOD =");
      setScreen(calcMode);
    }
  } else {
    setStatus(sLeftParts.join(" "), "BA II PLUS");
  }
};

const tvmEq = (n, r, pv, pmt, fv) => {
  if (Math.abs(r) < 1e-12) return pv + pmt * n + fv;
  const g = Math.pow(1 + r, n);
  const pmtTerm = isBgn ? pmt * (1 + r) : pmt;
  return pv * g + pmtTerm * ((g - 1) / r) + fv;
};

const solveTVM = (target) => {
  const vals = {
    n:   tvmVal("n"),
    iy:  tvmVal("iy"),
    pv:  tvmVal("pv"),
    pmt: tvmVal("pmt"),
    fv:  tvmVal("fv"),
  };
  const missing = Object.keys(vals).filter((k) => vals[k] === null);
  if (missing.length > 1 || (missing.length === 1 && missing[0] !== target)) {
    showError("Fill 4 TVM fields first");
    return;
  }

  try {
    let result;
    const { n, iy, pv, pmt, fv } = vals;
    const r = iy !== null ? getRatePerPeriod(iy) : 0;
    const pmtTerm = isBgn ? pmt * (1 + r) : pmt;

    if (target === "fv") {
      result = Math.abs(r) < 1e-12
        ? -(pv + pmtTerm * n)
        : -(pv * Math.pow(1 + r, n) + pmtTerm * ((Math.pow(1 + r, n) - 1) / r));
      tvmInputs.fv.value = fmt(result);
    } else if (target === "pv") {
      result = Math.abs(r) < 1e-12
        ? -(pmtTerm * n + fv)
        : -((pmtTerm * ((Math.pow(1 + r, n) - 1) / r) + fv) / Math.pow(1 + r, n));
      tvmInputs.pv.value = fmt(result);
    } else if (target === "pmt") {
      result = Math.abs(r) < 1e-12
        ? -(pv + fv) / n
        : -((pv * Math.pow(1 + r, n) + fv) * r) / ((Math.pow(1 + r, n) - 1) * (isBgn ? (1 + r) : 1));
      tvmInputs.pmt.value = fmt(result);
    } else if (target === "n") {
      result = bisect((periods) => tvmEq(periods, r, pv, pmt, fv), 1e-9, 1000);
      if (result === null || !Number.isFinite(result)) throw new Error("no solution");
      tvmInputs.n.value = fmt(result);
    } else if (target === "iy") {
      const rSol = bisect((rate) => tvmEq(n, rate, pv, pmt, fv), -0.9999, 100);
      if (rSol === null || !Number.isFinite(rSol)) throw new Error("no solution");
      result = getIyFromRate(rSol);
      tvmInputs.iy.value = fmt(result);
    }

    setScreen(fmt(result));
    setExpr(target.toUpperCase() + " =");
    setStatus("TVM", `CPT ${target.toUpperCase()} ✓`);
    expression = "0";
  } catch {
    showError("TVM: no solution — check signs");
  }
};

/* ── CF worksheet ────────────────────────────────────── */
const renderCFList = () => {
  const list = document.getElementById("cfList");
  list.innerHTML = "";
  cfEntries.forEach((entry, i) => {
    const row = document.createElement("div");
    row.className = "cf-row";

    const label = document.createElement("span");
    label.className = "cf-row-label";
    label.textContent = i === 0 ? "CF0" : `CF${i}`;

    const cfInput = document.createElement("input");
    cfInput.type = "number";
    cfInput.inputMode = "decimal";
    cfInput.placeholder = i === 0 ? "e.g. -1000" : "0";
    cfInput.value = entry.cf || "";
    cfInput.setAttribute("aria-label", `Cash flow ${i}`);
    cfInput.addEventListener("input", () => { cfEntries[i].cf = Number(cfInput.value) || 0; });

    const freqWrap = document.createElement("div");
    freqWrap.className = "cf-row-freq";
    if (i > 0) {
      const freqLabel = document.createElement("label");
      freqLabel.textContent = "×";
      freqLabel.style.color = "#607080";
      const freqInput = document.createElement("input");
      freqInput.type = "number";
      freqInput.inputMode = "decimal";
      freqInput.placeholder = "1";
      freqInput.min = "1";
      freqInput.value = entry.freq || 1;
      freqInput.setAttribute("aria-label", `Frequency for CF ${i}`);
      freqInput.addEventListener("input", () => { cfEntries[i].freq = Math.max(1, parseInt(freqInput.value) || 1); });
      freqWrap.appendChild(freqLabel);
      freqWrap.appendChild(freqInput);
    }

    if (i > 0) {
      const removeBtn = document.createElement("button");
      removeBtn.className = "cf-remove";
      removeBtn.textContent = "✕";
      removeBtn.setAttribute("aria-label", `Remove CF ${i}`);
      removeBtn.addEventListener("click", () => {
        cfEntries.splice(i, 1);
        renderCFList();
      });
      row.append(label, cfInput, freqWrap, removeBtn);
    } else {
      row.append(label, cfInput, freqWrap);
    }
    list.appendChild(row);
  });
};

/* ── NPV calculation ─────────────────────────────────── */
const calcNPV = (rate, entries) => {
  let npv = entries[0].cf;
  let t = 0;
  for (let i = 1; i < entries.length; i++) {
    const freq = entries[i].freq || 1;
    for (let j = 0; j < freq; j++) {
      t++;
      npv += entries[i].cf / Math.pow(1 + rate, t);
    }
  }
  return npv;
};

document.getElementById("btnCptNPV").addEventListener("click", () => {
  const rateRaw = document.getElementById("cfRate").value.trim();
  if (!rateRaw) { showError("Enter I/Y % first"); return; }
  const rate = Number(rateRaw) / 100;
  if (!Number.isFinite(rate)) { showError("Invalid I/Y"); return; }
  try {
    const npv = calcNPV(rate, cfEntries);
    lastResult = npv;
    expression = String(npv);
    setScreen(fmt(npv));
    setExpr("NPV =");
    setStatus("CF", "NPV ✓");
  } catch { showError("NPV calculation failed"); }
});

document.getElementById("btnCptIRR").addEventListener("click", () => {
  try {
    const fn = (r) => calcNPV(r, cfEntries);
    const irr = bisect(fn, -0.9999, 10);
    if (irr === null || !Number.isFinite(irr)) throw new Error("no IRR");
    const irrPct = irr * 100;
    lastResult = irrPct;
    expression = String(irrPct);
    setScreen(fmt(irrPct));
    setExpr("IRR (%) =");
    setStatus("CF", "IRR ✓");
  } catch { showError("No IRR found — check CF signs"); }
});

/* ── Math helpers ────────────────────────────────────── */
const currentNum = () => {
  try {
    if (calcMode === "Chn") {
      return evaluateChain(expression);
    }
    // eslint-disable-next-line no-new-func
    return Function('"use strict"; return (' + expression + ")")();
  } catch { return parseFloat(expression) || 0; }
};

const applyMath = (fn) => {
  try {
    const x = currentNum();
    const result = fn(x);
    if (!Number.isFinite(result)) throw new Error("domain error");
    lastResult = result;
    expression = String(result);
    setScreen(fmt(result));
    setExpr("");
  } catch (e) { showError(e.message || "Math error"); }
};

/* ── Keypad click handler ────────────────────────────── */
document.getElementById("keypad").addEventListener("click", (e) => {
  const btn = e.target.closest("button.key");
  if (!btn) return;

  const val    = btn.dataset.value;
  const action = btn.dataset.action;

  // Intercept keys when in BGN mode
  if (currentMode === "bgn") {
    if (action === "2nd") {
      toggle2nd();
      return;
    }
    if (action === "enter" || action === "assign" || action === "equals") {
      consume2nd();
      isBgn = !isBgn;
      updateDisplay();
      return;
    }
    if (action === "clearAll") {
      consume2nd();
      currentMode = "standard";
      expression = "0";
      setScreen(fmt(0));
      setExpr("");
      updateDisplay();
      return;
    }
    if (action === "cpt" && is2nd) {
      consume2nd();
      currentMode = "standard";
      expression = "0";
      setScreen(fmt(0));
      setExpr("");
      updateDisplay();
      return;
    }
    // For any other key, automatically exit BGN mode to standard, then proceed
    consume2nd();
    currentMode = "standard";
    expression = "0";
    setScreen(fmt(0));
    setExpr("");
    updateDisplay();
  }

  // Intercept keys when in P/Y & C/Y mode
  if (currentMode === "py") {
    if (action === "2nd") {
      toggle2nd();
      return;
    }
    if (action === "enter" || action === "assign" || action === "equals") {
      consume2nd();
      if (pyInputBuffer !== "") {
        const v = parseFloat(pyInputBuffer);
        if (Number.isFinite(v) && v > 0) {
          if (pyActiveIndex === 0) {
            pyVal = v;
            cyVal = v; // C/Y follows P/Y
          } else {
            cyVal = v;
          }
        }
        pyInputBuffer = "";
      }
      updateDisplay();
      return;
    }
    if (action === "clearAll") {
      consume2nd();
      if (pyInputBuffer !== "") {
        pyInputBuffer = "";
        updateDisplay();
      } else {
        currentMode = "standard";
        setScreen(fmt(currentNum()));
        setExpr("");
        updateDisplay();
      }
      return;
    }
    if (action === "cpt" && is2nd) {
      consume2nd();
      currentMode = "standard";
      setScreen(fmt(currentNum()));
      setExpr("");
      updateDisplay();
      return;
    }
    if (action === "arrowUp" || action === "arrowDn") {
      consume2nd();
      pyActiveIndex = (pyActiveIndex + 1) % 2;
      pyInputBuffer = "";
      updateDisplay();
      return;
    }
    // For any other key, if it's not a digit (digit is handled by intercept digits/dot below),
    // we exit py mode to standard, then let the key be processed.
    if (val === undefined || !/^[0-9.]$/.test(val)) {
      consume2nd();
      currentMode = "standard";
      setScreen(fmt(currentNum()));
      setExpr("");
      updateDisplay();
      // DO NOT return, so it falls through to execute the key!
    }
  }

  // Intercept keys when in FORMAT mode
  if (currentMode === "format") {
    if (action === "2nd") {
      toggle2nd();
      return;
    }
    if (action === "arrowUp") {
      consume2nd();
      formatActiveIndex = (formatActiveIndex + 3) % 4;
      formatInputBuffer = "";
      updateDisplay();
      return;
    }
    if (action === "arrowDn") {
      consume2nd();
      formatActiveIndex = (formatActiveIndex + 1) % 4;
      formatInputBuffer = "";
      updateDisplay();
      return;
    }
    if (action === "enter" || action === "assign" || action === "equals") {
      consume2nd();
      if (formatActiveIndex === 0) {
        if (formatInputBuffer !== "") {
          const v = parseInt(formatInputBuffer, 10);
          if (Number.isFinite(v) && v >= 0 && v <= 9) {
            decVal = v;
          }
          formatInputBuffer = "";
        }
      } else if (formatActiveIndex === 1) {
        angleMode = (angleMode === "DEG" ? "RAD" : "DEG");
      } else if (formatActiveIndex === 2) {
        dateMode = (dateMode === "US" ? "EUR" : "US");
      } else if (formatActiveIndex === 3) {
        calcMode = (calcMode === "Chn" ? "AOS" : "Chn");
      }
      updateDisplay();
      return;
    }
    if (action === "clearAll") {
      consume2nd();
      if (formatInputBuffer !== "") {
        formatInputBuffer = "";
        updateDisplay();
      } else {
        currentMode = "standard";
        setScreen(fmt(currentNum()));
        setExpr("");
        updateDisplay();
      }
      return;
    }
    if (action === "cpt" && is2nd) {
      consume2nd();
      currentMode = "standard";
      setScreen(fmt(currentNum()));
      setExpr("");
      updateDisplay();
      return;
    }
    // If user enters a digit in DEC mode
    if (formatActiveIndex === 0 && val !== undefined && /^[0-9]$/.test(val)) {
      consume2nd();
      formatInputBuffer = val;
      updateDisplay();
      return;
    }
    // For any other key, exit format mode to standard, then proceed
    if (val === undefined || !/^[0-9]$/.test(val)) {
      consume2nd();
      currentMode = "standard";
      setScreen(fmt(currentNum()));
      setExpr("");
      updateDisplay();
      // DO NOT return, so it falls through to execute the key!
    }
  }

  // Intercept digits/dot/signs when not in standard mode
  if (currentMode !== "standard") {
    // If it's a digit or dot
    if (val !== undefined && /^[0-9.]$/.test(val)) {
      consume2nd();
      if (currentMode === "amort" && (amortActiveIndex === 0 || amortActiveIndex === 1)) {
        amortInputBuffer += val;
        updateDisplay();
      } else if (currentMode === "py") {
        pyInputBuffer += val;
        updateDisplay();
      } else if (currentMode === "format") {
        if (formatActiveIndex === 0 && /^[0-9]$/.test(val)) {
          formatInputBuffer = val;
          updateDisplay();
        }
      }
      return;
    }
  }

  // ── 2ND + . (FORMAT) ─────────────────────────────
  if (val === ".") {
    const is2ndActive = consume2nd();
    if (is2ndActive) {
      currentMode = "format";
      formatInputBuffer = "";
      updateDisplay();
      return;
    }
  }

  // ── Digit / operator tap in Standard Mode ─────────
  if (val !== undefined) {
    consume2nd();
    appendValue(val);
    return;
  }

  if (!action) return;

  // ── 2ND ─────────────────────────────────────────
  if (action === "2nd") { toggle2nd(); return; }

  // ── Memory: STO ─────────────────────────────────
  if (action === "sto") {
    consume2nd();
    openRegOverlay("sto");
    return;
  }

  // ── Memory: RCL ─────────────────────────────────
  if (action === "rcl") {
    consume2nd();
    openRegOverlay("rcl");
    return;
  }

  // ── TVM / AMORT / P/Y ─────────────────────────────
  if (action === "tvm") {
    const is2ndActive = consume2nd();
    const target = btn.dataset.target;

    if (is2ndActive) {
      if (target === "pv") {
        // AMORT Worksheet
        currentMode = "amort";
        amortActiveIndex = 0;
        amortInputBuffer = "";
        tvmPanel.hidden = true;
        cfPanel.hidden = true;
        updateDisplay();
        return;
      }
      if (target === "pmt") {
        // BGN Worksheet
        currentMode = "bgn";
        updateDisplay();
        return;
      }
      if (target === "iy") {
        // P/Y Worksheet
        currentMode = "py";
        pyActiveIndex = 0;
        pyInputBuffer = "";
        updateDisplay();
        return;
      }
    }

    if (isCpt) {
      isCpt = false;
      setStatus("", "");
      solveTVM(target);
      return;
    }

    // Normal TVM key click: store current screen value into the TVM variable
    const valToStore = currentNum();
    if (target && tvmInputs[target]) {
      tvmInputs[target].value = fmt(valToStore);
    }

    currentMode = "standard";
    openTVM();
    if (target && tvmInputs[target]) tvmInputs[target].focus();
    
    setExpr(target.toUpperCase() + " =");
    setScreen(fmt(valToStore));
    expression = "0";
    return;
  }

  // ── CLR TVM / FV ─────────────────────────────────
  if (action === "clrTVM") {
    const is2ndActive = consume2nd();
    if (is2ndActive) {
      // 2ND + FV → CLR TVM
      ["n", "iy", "pv", "pmt", "fv"].forEach((k) => {
        if (tvmInputs[k]) tvmInputs[k].value = "";
      });
      openTVM();
      setStatus("TVM", "Cleared");
    } else {
      if (isCpt) {
        isCpt = false;
        setStatus("", "");
        solveTVM("fv");
        return;
      }

      // Regular FV click: store current screen value and focus FV
      const valToStore = currentNum();
      if (tvmInputs.fv) {
        tvmInputs.fv.value = fmt(valToStore);
      }
      currentMode = "standard";
      openTVM();
      if (tvmInputs.fv) tvmInputs.fv.focus();
      
      setExpr("FV =");
      setScreen(fmt(valToStore));
      expression = "0";
    }
    return;
  }

  // ── Arrow Keys Navigation ────────────────────────
  if (action === "arrowUp") {
    consume2nd();
    if (currentMode === "amort") {
      amortActiveIndex = (amortActiveIndex + 4) % 5;
      amortInputBuffer = "";
      updateDisplay();
    }
    return;
  }

  if (action === "arrowDn") {
    consume2nd();
    if (currentMode === "amort") {
      amortActiveIndex = (amortActiveIndex + 1) % 5;
      amortInputBuffer = "";
      updateDisplay();
    }
    return;
  }

  // ── CF Worksheet ─────────────────────────────────
  if (action === "cf") {
    consume2nd();
    openCF();
    return;
  }

  // ── NPV/IRR quick CPT ───────────────────────────
  if (action === "npv") {
    consume2nd();
    openCF();
    document.getElementById("cfRate").focus();
    return;
  }

  if (action === "irr") {
    consume2nd();
    openCF();
    document.getElementById("btnCptIRR").click();
    return;
  }

  // ── Equals / evaluate / save inputs ──────────────
  if (action === "equals") {
    if (consume2nd()) {
      if (currentMode === "standard") {
        // ANS
        expression = String(lastResult);
        setScreen(fmt(lastResult));
        setExpr("ANS");
      }
    } else {
      if (currentMode === "amort" && (amortActiveIndex === 0 || amortActiveIndex === 1)) {
        if (amortInputBuffer !== "") {
          const v = parseFloat(amortInputBuffer);
          if (Number.isFinite(v)) {
            if (amortActiveIndex === 0) amortP1 = v;
            else amortP2 = v;
          }
          amortInputBuffer = "";
        }
        updateDisplay();
      } else if (currentMode === "standard") {
        safeEval();
      }
    }
    return;
  }

  // ── ENTER / assign ──
  if (action === "enter" || action === "assign") {
    consume2nd();
    if (currentMode === "amort" && (amortActiveIndex === 0 || amortActiveIndex === 1)) {
      if (amortInputBuffer !== "") {
        const v = parseFloat(amortInputBuffer);
        if (Number.isFinite(v)) {
          if (amortActiveIndex === 0) amortP1 = v;
          else amortP2 = v;
        }
        amortInputBuffer = "";
      }
      updateDisplay();
    } else if (currentMode === "standard") {
      safeEval();
    }
    return;
  }

  // ── CPT / 2ND+CPT (QUIT) ──────────────────────────
  if (action === "cpt") {
    if (consume2nd()) {
      // 2ND + CPT → QUIT: close panels, reset display to 0, return to standard
      currentMode = "standard";
      expression = "0";
      lastResult  = 0;
      isCpt = false;
      tvmPanel.hidden   = true;
      cfPanel.hidden    = true;
      regOverlay.hidden = true;
      setScreen(fmt(0));
      setExpr("");
      setStatus("", "QUIT");
      updateDisplay();
    } else {
      if (currentMode === "standard") {
        isCpt = true;
        setStatus("CPT", "");
      }
    }
    return;
  }

  // ── Backspace / DEL ──────────────────────────────
  if (action === "backspace") {
    consume2nd();
    if (currentMode === "amort" && (amortActiveIndex === 0 || amortActiveIndex === 1)) {
      if (amortInputBuffer.length > 0) {
        amortInputBuffer = amortInputBuffer.slice(0, -1);
        updateDisplay();
      }
      return;
    }
    expression = expression.length > 1 ? expression.slice(0, -1) : "0";
    setScreen(expression);
    return;
  }

  // ── Clear all / CLR WORK ─────────────────────────
  if (action === "clearAll") {
    const is2ndActive = consume2nd();
    if (is2ndActive) {
      // 2ND + CE/C → CLR WORK
      if (currentMode === "amort") {
        amortP1 = 1;
        amortP2 = 1;
        amortActiveIndex = 0;
        amortInputBuffer = "";
        updateDisplay();
      } else {
        // Clear standard values
        is2nd = false;
        btn2nd.classList.remove("active");
        expression = "0";
        pendingOp  = null;
        regOverlay.hidden = true;
        setScreen(fmt(0));
        setExpr("");
        setStatus("", "Cleared");
        updateDisplay();
      }
      return;
    }

    // Normal CE/C click
    if (currentMode === "amort" && (amortActiveIndex === 0 || amortActiveIndex === 1)) {
      amortInputBuffer = "";
      updateDisplay();
      return;
    }

    is2nd = false;
    btn2nd.classList.remove("active");
    expression = "0";
    pendingOp  = null;
    regOverlay.hidden = true;
    setScreen(fmt(0));
    setExpr("");
    setStatus("", "Cleared");
    updateDisplay();
    return;
  }

  // ── Plus/Minus sign flip ─────────────────────────
  if (action === "plusMinus") {
    const is2ndActive = consume2nd();
    if (is2ndActive) {
      // 2ND + +/- is RESET
      decVal = 2;
      calcMode = "Chn";
      angleMode = "DEG";
      dateMode = "US";
      expression = "0";
      setScreen(fmt(0));
      setExpr("");
      setStatus("", "RESET");
      updateDisplay();
      return;
    }
    if (currentMode === "amort" && (amortActiveIndex === 0 || amortActiveIndex === 1)) {
      if (amortInputBuffer.startsWith("-")) {
        amortInputBuffer = amortInputBuffer.slice(1);
      } else {
        amortInputBuffer = "-" + amortInputBuffer;
      }
      updateDisplay();
      return;
    }
    expression = expression.startsWith("-") ? expression.slice(1) : "-" + expression;
    setScreen(expression);
    return;
  }

  // ── Parens ───────────────────────────────────────
  if (action === "openParen")  { consume2nd(); appendValue("("); return; }
  if (action === "closeParen") { consume2nd(); appendValue(")"); return; }

  // ── Math functions ───────────────────────────────
  if (action === "percent") {
    consume2nd();
    applyMath((x) => x / 100);
    setExpr("÷ 100");
    return;
  }

  if (action === "sqrt") {
    consume2nd();
    applyMath((x) => {
      if (x < 0) throw new Error("√ of negative");
      return Math.sqrt(x);
    });
    setExpr("√x");
    return;
  }

  if (action === "square") {
    consume2nd();
    applyMath((x) => x * x);
    setExpr("x²");
    return;
  }

  if (action === "reciprocal") {
    consume2nd();
    applyMath((x) => {
      if (x === 0) throw new Error("Divide by 0");
      return 1 / x;
    });
    setExpr("1/x");
    return;
  }

  if (action === "ln") {
    if (consume2nd()) {
      // eˣ
      applyMath((x) => Math.exp(x));
      setExpr("eˣ");
    } else {
      applyMath((x) => {
        if (x <= 0) throw new Error("LN domain error");
        return Math.log(x);
      });
      setExpr("LN");
    }
    return;
  }

  if (action === "inv") {
    consume2nd();
    applyMath((x) => 1 / x);
    setExpr("INV");
    return;
  }

  if (action === "power") {
    // Enters y^x mode: append ** operator so user types exponent
    consume2nd();
    if (!expression.endsWith("**")) {
      expression += "**";
    }
    setScreen(expression);
    return;
  }

  // ── Unimplemented keys – show label ─────────────
  consume2nd();
});

/* ── Keyboard support ────────────────────────────────── */
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return; // don't intercept worksheet inputs

  // Intercept for BGN, AMORT, and P/Y worksheet modes
  if (currentMode !== "standard") {
    if (currentMode === "bgn") {
      if (e.key === "Enter" || e.key === "=") {
        e.preventDefault();
        isBgn = !isBgn;
        updateDisplay();
        return;
      }
      if (e.key === "Escape" || e.key.toLowerCase() === "c") {
        currentMode = "standard";
        expression = "0";
        setScreen("0");
        setExpr("");
        updateDisplay();
        return;
      }
      currentMode = "standard";
      expression = "0";
      setScreen("0");
      setExpr("");
      updateDisplay();
      // Let it fall through to standard key handling
    }

    if (currentMode === "py") {
      if (e.key === "Enter" || e.key === "=") {
        e.preventDefault();
        if (pyInputBuffer !== "") {
          const v = parseFloat(pyInputBuffer);
          if (Number.isFinite(v) && v > 0) {
            if (pyActiveIndex === 0) {
              pyVal = v;
              cyVal = v; // C/Y follows P/Y
            } else {
              cyVal = v;
            }
          }
          pyInputBuffer = "";
        }
        updateDisplay();
        return;
      }
      if (e.key === "Escape" || e.key.toLowerCase() === "c") {
        if (pyInputBuffer !== "") {
          pyInputBuffer = "";
          updateDisplay();
        } else {
          currentMode = "standard";
          setScreen(fmt(currentNum()));
          setExpr("");
          updateDisplay();
        }
        return;
      }
      if (e.key === "Backspace") {
        if (pyInputBuffer.length > 0) {
          pyInputBuffer = pyInputBuffer.slice(0, -1);
          updateDisplay();
        }
        return;
      }
      if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        pyActiveIndex = (pyActiveIndex + 1) % 2;
        pyInputBuffer = "";
        updateDisplay();
        return;
      }
      if (/^[0-9.]$/.test(e.key)) {
        pyInputBuffer += e.key;
        updateDisplay();
        return;
      }
      // Any other key in py mode: exit to standard, then fall through
      currentMode = "standard";
      setScreen(fmt(currentNum()));
      setExpr("");
      updateDisplay();
    }

    if (currentMode === "format") {
      if (e.key === "Enter" || e.key === "=") {
        e.preventDefault();
        if (formatActiveIndex === 0) {
          if (formatInputBuffer !== "") {
            const v = parseInt(formatInputBuffer, 10);
            if (Number.isFinite(v) && v >= 0 && v <= 9) {
              decVal = v;
            }
            formatInputBuffer = "";
          }
        } else if (formatActiveIndex === 1) {
          angleMode = (angleMode === "DEG" ? "RAD" : "DEG");
        } else if (formatActiveIndex === 2) {
          dateMode = (dateMode === "US" ? "EUR" : "US");
        } else if (formatActiveIndex === 3) {
          calcMode = (calcMode === "Chn" ? "AOS" : "Chn");
        }
        updateDisplay();
        return;
      }
      if (e.key === "ArrowUp") {
        e.preventDefault();
        formatActiveIndex = (formatActiveIndex + 3) % 4;
        formatInputBuffer = "";
        updateDisplay();
        return;
      }
      if (e.key === "ArrowDown") {
        e.preventDefault();
        formatActiveIndex = (formatActiveIndex + 1) % 4;
        formatInputBuffer = "";
        updateDisplay();
        return;
      }
      if (e.key === "Escape" || e.key.toLowerCase() === "c") {
        if (formatInputBuffer !== "") {
          formatInputBuffer = "";
          updateDisplay();
        } else {
          currentMode = "standard";
          setScreen(fmt(currentNum()));
          setExpr("");
          updateDisplay();
        }
        return;
      }
      if (e.key === "Backspace") {
        if (formatInputBuffer.length > 0) {
          formatInputBuffer = "";
          updateDisplay();
        }
        return;
      }
      if (/^[0-9]$/.test(e.key) && formatActiveIndex === 0) {
        formatInputBuffer = e.key;
        updateDisplay();
        return;
      }
      // Any other key in format mode: exit to standard, then fall through
      currentMode = "standard";
      setScreen(fmt(currentNum()));
      setExpr("");
      updateDisplay();
    }

    if (/^[0-9.]$/.test(e.key)) {
      if (currentMode === "amort" && (amortActiveIndex === 0 || amortActiveIndex === 1)) {
        amortInputBuffer += e.key;
        updateDisplay();
      }
      return;
    }
    if (e.key === "Enter" || e.key === "=") {
      e.preventDefault();
      if (currentMode === "amort" && (amortActiveIndex === 0 || amortActiveIndex === 1)) {
        if (amortInputBuffer !== "") {
          const v = parseFloat(amortInputBuffer);
          if (Number.isFinite(v)) {
            if (amortActiveIndex === 0) amortP1 = v;
            else amortP2 = v;
          }
          amortInputBuffer = "";
        }
        updateDisplay();
      }
      return;
    }
    if (e.key === "Backspace") {
      if (currentMode === "amort" && (amortActiveIndex === 0 || amortActiveIndex === 1)) {
        if (amortInputBuffer.length > 0) {
          amortInputBuffer = amortInputBuffer.slice(0, -1);
          updateDisplay();
        }
      }
      return;
    }
    if (e.key === "ArrowUp") {
      e.preventDefault();
      if (currentMode === "amort") {
        amortActiveIndex = (amortActiveIndex + 4) % 5;
        amortInputBuffer = "";
        updateDisplay();
      }
      return;
    }
    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (currentMode === "amort") {
        amortActiveIndex = (amortActiveIndex + 1) % 5;
        amortInputBuffer = "";
        updateDisplay();
      }
      return;
    }
    if (e.key === "Escape" || e.key.toLowerCase() === "c") {
      if (currentMode === "amort" && (amortActiveIndex === 0 || amortActiveIndex === 1)) {
        amortInputBuffer = "";
        updateDisplay();
      }
      return;
    }
    return; // Ignore other keys in worksheet mode
  }

  // Standard Mode Keyboard support
  if (/^[0-9]$/.test(e.key) || ["+", "-", "/", ".", "(", ")"].includes(e.key)) {
    appendValue(e.key);
    return;
  }
  if (e.key === "*") { appendValue("*"); return; }
  if (e.key === "Enter" || e.key === "=") { e.preventDefault(); safeEval(); return; }
  if (e.key === "Backspace") {
    expression = expression.length > 1 ? expression.slice(0, -1) : "0";
    setScreen(expression);
    return;
  }
  if (e.key === "Escape" || e.key.toLowerCase() === "c") {
    expression = "0"; setScreen(fmt(0)); setExpr(""); setStatus("");
  }
});

/* ── Boot ────────────────────────────────────────────── */
setScreen(fmt(0));
setExpr("");
setStatus("", "BA II PLUS");
updateDisplay();

/* ── Other Calculators Slider Arrows ─────────────────── */
document.addEventListener("DOMContentLoaded", () => {
  const track = document.getElementById("calcSliderTrack");
  const prevBtn = document.getElementById("calcSliderPrev");
  const nextBtn = document.getElementById("calcSliderNext");

  if (track && prevBtn && nextBtn) {
    const getScrollStep = () => {
      const card = track.querySelector(".calc-card");
      if (!card) return 288;
      const style = window.getComputedStyle(track);
      const gap = parseFloat(style.gap) || 24;
      return card.offsetWidth + gap;
    };

    nextBtn.addEventListener("click", () => {
      const step = getScrollStep();
      if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 15) {
        track.scrollTo({ left: 0, behavior: "smooth" });
      } else {
        track.scrollBy({ left: step, behavior: "smooth" });
      }
    });

    prevBtn.addEventListener("click", () => {
      const step = getScrollStep();
      if (track.scrollLeft <= 15) {
        track.scrollTo({ left: track.scrollWidth, behavior: "smooth" });
      } else {
        track.scrollBy({ left: -step, behavior: "smooth" });
      }
    });
  }
});
