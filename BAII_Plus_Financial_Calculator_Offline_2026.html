<!-- Behaviour patches. Both must come after script.js: ce_c_behavior.js reads
     that file's top-level bindings through the shared global lexical scope, and
     panel_focus.js shadows methods on elements script.js has already queried.
     Inlined at build time. -->
<script data-source="ce_c_behavior.js">
/* ─────────────────────────────────────────────────────────────────────────
   ce_c_behavior.js  --  make CE|C two-stage, like the real BA II Plus
   ─────────────────────────────────────────────────────────────────────────
   On the physical BA II Plus the bottom-left key is two functions on one key:

       press once   CE   clear the current ENTRY, keep any pending operation
       press again  C    clear EVERYTHING, pending operation included

   The web version upstream always does the full clear -- a single press with
   "12+" on the display discards the "+", where the real device keeps it. This
   file restores the two-stage behaviour.

   It is a separate file on purpose. script.js stays byte-for-byte upstream, so
   an upstream re-sync stays a clean diff and the calculator engine is never
   touched by hand. This is the only file in the project that changes how the
   calculator behaves rather than how it looks.

   How it can reach the engine at all: script.js declares its state with
   top-level `let`/`const` (expression, currentMode, is2nd, ...). In classic
   scripts those live in the shared global lexical environment rather than on
   window, so any script loaded afterwards can read and write them. Verified, not
   assumed: an appended script can both read `expression` and assign to it.

   Where it applies: standard calculation only. The worksheet modes (BGN, P/Y,
   FORMAT, AMORT) already clear the field you are typing into on a single press,
   which is the CE half of the behaviour already; their second press exits the
   worksheet. Overriding those would break the navigation, so they are left
   alone.

   Both input routes are covered -- the on-screen key and the keyboard shortcut
   -- because otherwise they would disagree, and pressing `c` after clicking
   CE|C would wipe everything unexpectedly.
   ───────────────────────────────────────────────────────────────────────── */

(() => {
  "use strict";

  const keypad = document.getElementById("keypad");

  /* True between the first and second press. Any other input clears it, which is
     what makes the pair "consecutive": press CE, then a digit, then CE again and
     you get CE twice, not a C. */
  let armed = false;

  /* True after a CE, until the user types the next entry.

     CE leaves an explicit 0 on the display, and typing over it has to REPLACE
     that 0 rather than append to it. Without this, "12+5" → CE → "12+0", then
     pressing 4 gives "12+04" rather than "12+4". That is not just cosmetic: in
     AOS the engine evaluates with Function('"use strict"; return (...)'), and in
     strict mode 04 is a legacy octal literal, so it is a SyntaxError and the
     display shows "Error". */
  let freshEntry = false;

  /* CE: drop the entry the user is currently typing, keep what came before it.

     `expression` holds the whole expression, not just the entry, so the trailing
     run of digits and dots is replaced with a fresh 0 and everything up to and
     including the last operator survives:

         "12+5"  -> "12+0"      "12+"   -> "12+0"
         "5"     -> "0"         "2**"   -> "2**0"
         "12+5*3"-> "12+5*0"    "-5"    -> "0"

     A bare "-" is treated as no operator, so a lone minus collapses to 0 rather
     than becoming "-0". */
  const clearEntry = () => {
    let i = expression.length;
    while (i > 0 && /[\d.]/.test(expression[i - 1])) i--;
    const head = expression.slice(0, i);

    if (head && head !== "-" && /[+\-*/]$/.test(head)) {
      // Something is still pending, so keep it and zero just the entry:
      // "12+5" -> "12+0", "2+3*4" -> "2+3*0".
      expression = head + "0";
      setScreen(expression);
    } else {
      // Nothing was pending, so this leaves exactly the state a full clear
      // would -- and it has to be RENDERED the same way, too.
      //
      // The engine has two conventions: setScreen(expression) shows a raw
      // expression while the user is typing, setScreen(fmt(n)) shows a formatted
      // number otherwise. Taking the raw path here would render "0" where a full
      // clear renders "0.00", so pressing CE|C on an already-clear calculator
      // would flip the readout between "0.00" and "0" on every press. Both states
      // are empty; only their spelling differed. fmt(0) keeps them identical, so
      // the display simply does not change -- which is what the real device does.
      expression = "0";
      setScreen(fmt(0));
    }

    setExpr("");
    updateDisplay();
    freshEntry = true;
  };

  const DIGIT = /^[0-9]$/;
  const OPERATOR = /^[+\-*/]$/;

  /* Drop the placeholder 0 that CE left, so the next keystroke starts a clean
     entry. Called just before the engine's own handler runs, so the engine's
     appendValue() sees "12+" and produces "12+7".

     A decimal point is deliberately excluded: after CE, "." should extend the 0
     into "0.", not start from nothing. */
  const startFreshEntry = () => {
    expression = expression.replace(/0$/, "") || "0";
    freshEntry = false;
  };

  /* Decide whether this press is CE, C, or none of our business.

     Returns true when the press has been handled as CE and the engine's own
     handler must be suppressed. Returning false lets the press through, so the
     engine performs its full clear -- which is exactly the C half. */
  const intercept = () => {
    // 2ND + CE|C is CLR WORK, a different function. Never interfere.
    if (is2nd) {
      armed = false;
      return false;
    }

    // Worksheet modes handle their own clearing and navigation.
    if (currentMode !== "standard") {
      armed = false;
      return false;
    }

    if (armed) {
      armed = false;
      return false; // second consecutive press -> engine does the full clear
    }

    clearEntry();
    armed = true;
    return true;
  };

  /* On-screen key.

     Capture phase on #keypad: the engine listens on #keypad in the bubble
     phase, and a capture listener on the same element runs first, so
     stopPropagation() here keeps the engine's handler from seeing the click. */
  keypad.addEventListener(
    "click",
    (e) => {
      const btn = e.target.closest("button.key");
      if (!btn) return;

      if (btn.dataset.action !== "clearAll") {
        armed = false; // any other key breaks the pair

        // Type-over: replace the 0 CE left instead of appending to it. Must run
        // before the engine's handler, which is why this is the capture phase.
        if (freshEntry) {
          const v = btn.dataset.value;
          if (v !== undefined && (DIGIT.test(v) || OPERATOR.test(v))) {
            startFreshEntry();
          } else if (v === undefined) {
            freshEntry = false; // any non-entry key ends the fresh entry
          }
        }
        return;
      }

      if (intercept()) {
        e.stopPropagation();
        e.preventDefault();
      }
    },
    true
  );

  /* Keyboard shortcut (Escape or C), which the engine wires up separately from
     the keypad. Without this the on-screen key would be two-stage while the
     keyboard stayed one-stage.

     Capture phase on window for the same reason as above: the engine registered
     its own window keydown listener at load time, so a bubble-phase listener
     here would run second. */
  window.addEventListener(
    "keydown",
    (e) => {
      if (e.target.tagName === "INPUT") return; // worksheet inputs are the engine's

      if (e.key !== "Escape" && e.key.toLowerCase() !== "c") {
        armed = false;
        // Same type-over rule for the keyboard route.
        if (freshEntry && (DIGIT.test(e.key) || OPERATOR.test(e.key))) {
          startFreshEntry();
        } else if (e.key.startsWith("Arrow") || e.key === "Enter" || e.key === "=") {
          freshEntry = false;
        }
        return;
      }

      // Outside standard mode these keys navigate worksheets; leave them be.
      if (currentMode !== "standard") {
        armed = false;
        return;
      }
      if (intercept()) {
        e.stopPropagation();
        e.preventDefault();
      }
    },
    true
  );
})();

</script>
<script data-source="panel_focus.js">
/* ─────────────────────────────────────────────────────────────────────────
   panel_focus.js  --  stop a worksheet panel grabbing focus when it opens
   ─────────────────────────────────────────────────────────────────────────
   Pressing 8 then N opens the TVM worksheet and, upstream, immediately focuses
   the N field. On a desktop that is a small convenience: the caret is already
   where you would click next.

   On a phone it breaks the thing you are actually doing. The panel sits below
   the device, so focusing a field scrolls it into view -- animated, because
   styles.css sets `scroll-behavior: smooth` -- and the virtual keyboard covers
   what is left. The calculator you were typing on disappears, and every
   subsequent keypress scrolls back to the focused field. Your eye and your
   thumb end up in different places.

   script.js focuses a panel input from three places, all immediately after
   opening a panel:

       988   the N / I-Y / PV / PMT keys, on the matching field
      1021   the FV key, on FV
      1062   the NPV key, on #cfRate in the cash flow panel

   The register overlay has no inputs, so STO/RCL was never affected.

   The fix shadows `focus` on those inputs. A tap or click on a field is handled
   by the browser's own default action, which does not go through this method, so
   tapping still focuses normally -- the keyboard now opens when the user asks for
   it rather than the moment a panel appears. Nothing reads document.activeElement
   and no selection APIs are used anywhere in the engine, so the only thing lost
   is the automatic caret placement.

   Like ce_c_behavior.js, this is a separate file so script.js stays byte-for-byte
   upstream.
   ───────────────────────────────────────────────────────────────────────── */

(() => {
  "use strict";

  const PANEL_INPUTS = "#tvmPanel input, #cfPanel input, #registerOverlay input";

  for (const el of document.querySelectorAll(PANEL_INPUTS)) {
    el.focus = function () {
      /* Intentionally empty. See the note above: this swallows the three
         programmatic .focus() calls in script.js and nothing else. */
    };
  }
})();

</script>
<script data-source="entry_behavior.js">
/* ─────────────────────────────────────────────────────────────────────────
   entry_behavior.js  --  a completed operation ends the entry
   ─────────────────────────────────────────────────────────────────────────
   On a real BA II Plus, anything that finishes a calculation also finishes the
   number being entered. Type `1 + 2 =` and the 3.00 on screen is a result:
   pressing `4` next starts a new number and shows 4. The same is true after
   STO, after RCL, and after any of the maths keys.

   The web version keeps the finished value in the entry buffer instead, so `4`
   extends the result to 34 and `82 STO 2` then `23` becomes 8223. This file
   restores the device's behaviour, and also adds the STO/RCL gestures the device
   has and the panel does not:

       1234 STO 1        stores 1234 in register 1     (digit, or click the panel)
       RCL 1             brings it back as the entry   (digit, or click the panel)
       23 + RCL 1 =      recalls into a running calculation
       RCL I/Y           recalls a TVM variable rather than overwriting it

   Both the panel and the keypad route through the same store()/recallRegister()
   here, so they cannot drift apart.

   WHAT COUNTS AS COMPLETED, and why the rule differs from CE|C's:

   - After STO, RCL or a result key, the value on screen is REAL. Pressing a digit
     replaces it (a new number), but pressing an operator must keep it -- it is
     the left operand. `3` then `+` has to give `3+`, not `0+`.
   - After CE|C, the value on screen is a placeholder zero that CE put there. That
     one IS dropped for an operator too, which is why ce_c_behavior.js strips on
     both. Getting this backwards is what made `RCL I/Y` then `+` show `0+`.

   How it reaches the engine: script.js declares its state with top-level
   let/const, which in classic scripts share the global lexical scope, so `MEM`,
   `expression`, `currentNum()`, `tvmVal()`, `openRegOverlay()` and the display
   helpers are all reachable from here. Keys are hooked in the capture phase,
   ahead of the engine's own bubble-phase listeners, and a press is suppressed
   only when this file has handled it.

   Note for anyone tempted to use it: `pendingOp` in script.js looks like it
   tracks the STO/RCL state and does not. It is assigned by openRegOverlay() and
   read nowhere. This file keeps its own `pending`, and mirrors it into `pendingOp`
   only so the engine's own cancel handler stays consistent.
   ───────────────────────────────────────────────────────────────────────── */

(() => {
  "use strict";

  const keypad = document.getElementById("keypad");
  const overlay = document.getElementById("registerOverlay");

  const DIGIT = /^[0-9]$/;
  /* What begins a new entry rather than continuing one. */
  const STARTS_ENTRY = /^[0-9.]$/;
  const OPERATOR = /^[+\-*/]$/;

  /* Keys that leave a finished number on screen. All of them end with
     `expression = String(result)` and `setScreen(fmt(result))`. */
  const RESULT_ACTIONS = new Set([
    "equals", "percent", "sqrt", "square", "reciprocal", "ln",
  ]);

  /* "sto" or "rcl" while a register is being chosen, null otherwise. */
  let pending = null;

  /* True once an operation has finished: the next digit starts a new entry
     instead of extending the value on screen. */
  let fresh = false;

  /* Re-render, then label the status bar. Order matters -- updateDisplay() ends
     with setStatus(indicators, "BA II PLUS"), so anything written first is lost. */
  const setStatusText = (left, right) => {
    updateDisplay();
    setStatus(left, right);
  };

  const closePanel = () => {
    overlay.hidden = true;
    pendingOp = null;   // keep the engine's flag in step with ours
  };

  const arm = (mode) => {
    pending = mode;
    openRegOverlay(mode);            // the engine builds the grid and shows it
    setStatusText(mode === "sto" ? "STO" : "RCL", "BA II PLUS");
  };

  /* Abandon a pending STO/RCL. The caller decides whether the key that caused it
     should still do its own job. */
  const disarm = () => {
    if (!pending) return;
    pending = null;
    closePanel();
    updateDisplay();
  };

  /* Drop the entry being typed, keeping everything before it -- the last
     operator included. Returns the prefix, which is "" when nothing precedes
     the entry. */
  const dropEntry = () => {
    let k = expression.length;
    while (k > 0 && /[\d.]/.test(expression[k - 1])) k--;
    return expression.slice(0, k);
  };

  /* A digit arrived while the entry was finished: make it start a new number.

     The prefix is kept, so `23+` with a recall pending becomes `23+7` and not
     `7`. When nothing precedes it the entry is set to "0", which the engine's
     own appendValue() treats as "replace me" -- giving `7` rather than `07`. */
  const beginNewEntry = () => {
    expression = dropEntry() || "0";
    fresh = false;
  };

  /* An operator arrived while the entry was finished: the value stays, because it
     is the left operand. Just stop treating the entry as finished. */
  const keepEntry = () => {
    fresh = false;
  };

  /* STO n -- keep the value the display resolves to, exactly as currentNum()
     reads it (an evaluated expression, not the raw text). */
  const store = (i) => {
    const value = currentNum();
    MEM[i] = Number.isFinite(value) ? value : 0;
    pending = null;
    closePanel();
    expression = String(MEM[i]);
    setScreen(fmt(MEM[i]));
    setExpr("Stored to register " + i);
    setStatusText("", "STO " + i + " ✓");
    fresh = true;
  };

  /* RCL <value> -- bring it back as the current ENTRY so it can sit in the middle
     of a running calculation. */
  const recallValue = (value, label) => {
    const head = dropEntry();
    const literal = head !== "" && value < 0 ? "(" + value + ")" : String(value);
    expression = head + literal || "0";
    pending = null;
    closePanel();
    /* A standalone recall is a finished value, so it renders formatted and the
       next digit starts fresh. Recalling into a part-built expression is not:
       the entry is live and typing extends it, as typing always does. */
    setScreen(head === "" ? fmt(value) : expression);
    setExpr("Recalled " + label);
    setStatusText("", "RCL " + label);
    fresh = head === "";
  };

  const recallRegister = (i) => recallValue(MEM[i], "register " + i);

  /* The TVM variable a key refers to, or null for any other key. The FV key
     carries data-action="clrTVM" and only clears when 2ND is held. */
  const tvmIdOf = (btn) => {
    if (btn.dataset.action === "tvm") return btn.dataset.target;   // n iy pv pmt
    if (btn.dataset.action === "clrTVM") return "fv";
    return null;
  };

  /* A digit completes whichever of STO / RCL is waiting. */
  const completeWithDigit = (d) => {
    if (pending === "sto") store(d);
    else recallRegister(d);
  };

  /* ── the keypad ─────────────────────────────────────────────────────── */
  keypad.addEventListener(
    "click",
    (e) => {
      const btn = e.target.closest("button.key");
      if (!btn) return;
      const { action, value: val } = btn.dataset;

      if (pending) {
        if (val !== undefined && DIGIT.test(val)) {
          e.stopPropagation();
          e.preventDefault();
          completeWithDigit(Number(val));
          return;
        }
        /* RCL + a TVM key recalls that variable. Left to the engine it would
           STORE the display into it, wiping the value the user asked for. */
        if (pending === "rcl") {
          const id = tvmIdOf(btn);
          if (id) {
            e.stopPropagation();
            e.preventDefault();
            recallValue(tvmVal(id), id.toUpperCase());
            return;
          }
        }
        if (action === "sto" || action === "rcl") {
          e.stopPropagation();
          e.preventDefault();
          disarm();
          setStatusText("", "BA II PLUS");
          return;
        }
        /* Anything else cancels, and then does its own job as normal -- which is
           what makes STO + a TVM key store into that variable, as on the device. */
        disarm();
        return;
      }

      /* The entry is finished. Runs before the engine appends, which is why this
         is the capture phase. */
      if (fresh) {
        if (val !== undefined && STARTS_ENTRY.test(val)) beginNewEntry();
        else keepEntry();
      }

      /* A result key leaves a finished number on screen, so whatever is typed
         next starts a new entry. Armed here, before the engine evaluates. */
      if (RESULT_ACTIONS.has(action)) {
        fresh = true;
        return;
      }
      /* CPT followed by a TVM key solves, which also leaves a result. */
      if (isCpt && tvmIdOf(btn)) {
        fresh = true;
        return;
      }

      /* Only the standard calculator has registers to work with; inside a
         worksheet these keys mean nothing and the engine keeps its behaviour. */
      if (currentMode !== "standard") return;
      if (action !== "sto" && action !== "rcl") return;

      e.stopPropagation();
      e.preventDefault();
      consume2nd();
      arm(action);
    },
    true
  );

  /* ── the register panel ─────────────────────────────────────────────── */
  /* It lives outside #keypad, so it needs its own listener. Both routes go
     through store()/recallRegister() so the panel and the keypad cannot diverge. */
  overlay.addEventListener(
    "click",
    (e) => {
      const regBtn = e.target.closest(".reg-btn");
      if (regBtn && pending) {
        const num = regBtn.querySelector(".reg-btn-num");
        const i = num ? parseInt(num.textContent, 10) : NaN;
        if (Number.isInteger(i)) {
          e.stopPropagation();
          e.preventDefault();
          completeWithDigit(i);
          return;
        }
      }
      if (e.target.closest("#regCancel")) {
        pending = null;
        setStatusText("", "BA II PLUS");   // the engine hides the panel itself
      }
    },
    true
  );

  /* ── the keyboard ───────────────────────────────────────────────────── */
  window.addEventListener(
    "keydown",
    (e) => {
      if (e.target.tagName === "INPUT") return;

      if (!pending) {
        if (fresh) {
          if (STARTS_ENTRY.test(e.key)) beginNewEntry();
          else keepEntry();
        }
        /* Enter and = evaluate, so they leave a result behind them. */
        if (e.key === "Enter" || e.key === "=") fresh = true;
        return;
      }

      if (DIGIT.test(e.key)) {
        e.stopPropagation();
        e.preventDefault();
        completeWithDigit(Number(e.key));
        return;
      }
      if (e.key === "Escape") {
        e.stopPropagation();
        e.preventDefault();
        disarm();
        setStatusText("", "BA II PLUS");
        return;
      }
      disarm();   // any other key cancels and then behaves normally
    },
    true
  );
})();

</script>
</body>
</html>
