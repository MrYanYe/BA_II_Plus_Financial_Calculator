<title>BA II Plus Financial Calculator — Offline</title>

<!--
  GitHub Pages entry point.

  The deliverable keeps its real name, BAII_Plus_Financial_Calculator_Offline_2026.html,
  because that is the file people download and keep. GitHub Pages serves index.html at
  the root and has no way to alias a file, so this page forwards to it.

  Deliberately a redirect rather than a copy: a second 220 KB copy in the repository
  would be a second thing to keep in step with the build, and the whole point of the
  project is that there is exactly one file.
-->
<meta http-equiv="refresh" content="0; url=BAII_Plus_Financial_Calculator_Offline_2026.html" />
<link rel="canonical" href="BAII_Plus_Financial_Calculator_Offline_2026.html" />

<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #333 0%, #252525 100%);
    color: #f0f0f0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    text-align: center; padding: 1.5rem;
  }
  a { color: #f5c400; font-weight: 600; }
  p { line-height: 1.6; margin: 0.4rem 0; }
  .muted { color: #9aa0a6; font-size: 0.9rem; }
</style>
</head>
<body>

<noscript>
  <p>This page forwards to the calculator.</p>
  <p><a href="BAII_Plus_Financial_Calculator_Offline_2026.html">Open the BA II Plus calculator</a></p>
</noscript>

<script>
  /* The meta refresh above handles this without JavaScript; the script just gets
     there a moment sooner. */
  location.replace("BAII_Plus_Financial_Calculator_Offline_2026.html");
</script>

</body>
</html>
