<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Build pipeline: fetch, extract, build</title>

  <!-- Explicit light background: an SVG renders in its own context and cannot
       inherit the surrounding page's colours, so it must carry its own. -->
  <rect width="880" height="700" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="879" height="699" fill="none" stroke="#d8dee4"/>

  <text x="32" y="44" font-size="19" font-weight="700" fill="#1f2328">Build pipeline</text>
  <text x="32" y="68" font-size="13" fill="#59636e">Three steps, one script each. Re-runnable, and the output is byte-reproducible.</text>

  <!-- ══ the live site ══ -->
  <rect x="250" y="96" width="380" height="54" rx="7" fill="#eef2f6" stroke="#b9c2cc"/>
  <text x="268" y="120" font-size="15" font-weight="600" fill="#1f2328">the live site</text>
  <text x="268" y="139" font-size="12" fill="#59636e"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">baiiplusfinancialcalculator.com</text>

  <!-- arrow 1 -->
  <path d="M440 150 V192" stroke="#59636e" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="462" y="166" font-size="12.5" fill="#1f2328"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">fetch_upstream.py</text>
  <text x="462" y="183" font-size="11.5" fill="#8c959f">needs network · optional after the first run</text>

  <!-- ══ upstream_raw ══ -->
  <rect x="250" y="196" width="380" height="82" rx="7" fill="#eef2f6" stroke="#b9c2cc"/>
  <text x="268" y="221" font-size="15" font-weight="600" fill="#1f2328">upstream_raw/</text>
  <text x="268" y="241" font-size="12" fill="#59636e">pristine mirror of what the site serves — committed, so a clone rebuilds offline</text>
  <text x="268" y="262" font-size="11.5" fill="#7d8590"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">index.html · styles.css · script.js · google-fonts.css · fonts/</text>

  <!-- arrow 2 -->
  <path d="M440 278 V320" stroke="#59636e" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="462" y="294" font-size="12.5" fill="#1f2328"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">extract_calculator.py</text>
  <text x="462" y="311" font-size="11.5" fill="#8c959f">reads upstream_raw/ and both files in src/</text>

  <!-- ══ src ══ -->
  <rect x="32" y="324" width="188" height="82" rx="7" fill="#fff8e5" stroke="#d4a72c"/>
  <text x="48" y="349" font-size="15" font-weight="600" fill="#1f2328">src/</text>
  <text x="48" y="368" font-size="12" fill="#59636e">hand-written</text>
  <text x="48" y="386" font-size="11" fill="#7d8590"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">offline_overrides.css</text>
  <text x="48" y="400" font-size="11" fill="#7d8590"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ce_c_behavior.js</text>
  <path d="M220 365 H244" stroke="#d4a72c" stroke-width="1.8" marker-end="url(#g)"/>

  <!-- ══ build ══ -->
  <rect x="250" y="324" width="380" height="82" rx="7" fill="#eef2f6" stroke="#b9c2cc"/>
  <text x="268" y="349" font-size="15" font-weight="600" fill="#1f2328">build/</text>
  <text x="268" y="369" font-size="12" fill="#59636e">generated and disposable — gitignored, wipe it and re-run</text>
  <text x="268" y="390" font-size="11.5" fill="#7d8590"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">page.html · styles.css · script.js · fonts.css · fonts/</text>

  <!-- arrow 3 -->
  <path d="M440 406 V448" stroke="#59636e" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="462" y="422" font-size="12.5" fill="#1f2328"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">build_single_file.py</text>
  <text x="462" y="439" font-size="11.5" fill="#8c959f">inlines CSS, JS, fonts and favicon · asserts self-containment</text>

  <!-- ══ deliverable ══ -->
  <rect x="250" y="452" width="380" height="76" rx="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="268" y="477" font-size="15" font-weight="600" fill="#1f2328">the deliverable</text>
  <text x="268" y="497" font-size="11.5" fill="#3b4a54"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">BAII_Plus_Financial_Calculator_Offline_2026.html</text>
  <text x="268" y="515" font-size="11.5" fill="#3b4a54">199 KB · nothing referenced outside itself</text>

  <!-- ══ verification ══ -->
  <rect x="32" y="566" width="816" height="106" rx="7" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="48" y="590" font-size="13" font-weight="600" fill="#1f2328">Verification — not part of the build, they check it</text>
  <text x="48" y="612" font-size="11.5" fill="#3b4a54"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">verify_parity.py        behaviour vs the live site (needs network)</text>
  <text x="48" y="630" font-size="11.5" fill="#3b4a54"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">verify_visual.py        fonts, geometry, pixels vs the live site (needs network)</text>
  <text x="48" y="648" font-size="11.5" fill="#3b4a54"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">verify_ce_c.py · verify_panel_layout.py · verify_compatibility.py · check_readme_links.py</text>
  <text x="48" y="665" font-size="11.5" fill="#8c959f">Local ones need no network. Every script exits non-zero on failure.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#59636e"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d4a72c"/>
    </marker>
  </defs>
</svg>
