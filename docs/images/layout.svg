<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Worksheet placement: left when there is room, below when there is not</title>

  <rect width="880" height="470" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="879" height="469" fill="none" stroke="#d8dee4"/>

  <text x="32" y="42" font-size="19" font-weight="700" fill="#1f2328">Where the worksheet panels go</text>
  <text x="32" y="66" font-size="13" fill="#59636e">TVM, CF and STO/RCL open outside the device. The device itself never moves.</text>

  <!-- ══════════ scenario A ══════════ -->
  <text x="52" y="106" font-size="14" font-weight="600" fill="#1f2328">Landscape, ≥1120px wide</text>
  <text x="52" y="126" font-size="12" fill="#59636e">There is room beside it — panels go left.</text>

  <rect x="46" y="142" width="330" height="246" rx="9" fill="#f6f8fa" stroke="#d8dee4"/>

  <!-- panel stack, left of the device -->
  <rect x="62" y="158" width="112" height="86" rx="5" fill="#1e2e3a" stroke="#2d4556"/>
  <text x="72" y="176" font-size="9.5" fill="#f5c400" font-weight="700">TVM WORKSHEET</text>
  <rect x="72" y="184" width="42" height="13" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="120" y="184" width="42" height="13" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="72" y="202" width="42" height="13" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="120" y="202" width="42" height="13" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="72" y="220" width="42" height="13" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="120" y="220" width="42" height="13" rx="2" fill="#12202a" stroke="#2d4556"/>

  <rect x="62" y="252" width="112" height="60" rx="5" fill="#1e2e3a" stroke="#2d4556"/>
  <text x="72" y="270" font-size="9.5" fill="#f5c400" font-weight="700">STO — REGISTER</text>
  <rect x="72" y="278" width="26" height="13" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="104" y="278" width="26" height="13" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="136" y="278" width="26" height="13" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="72" y="296" width="26" height="13" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="104" y="296" width="26" height="13" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="136" y="296" width="26" height="13" rx="2" fill="#12202a" stroke="#2d4556"/>

  <!-- device -->
  <rect x="238" y="158" width="120" height="200" rx="9" fill="#333333" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="248" y="170" width="100" height="42" rx="5" fill="#8fa87a" stroke="#6e8a5a" stroke-width="2"/>
  <text x="330" y="196" font-size="11" fill="#141e0c" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.00</text>
  <g fill="#4a4a4a" stroke="#2a2a2a">
    <rect x="248" y="222" width="18" height="16" rx="3"/><rect x="270" y="222" width="18" height="16" rx="3"/>
    <rect x="292" y="222" width="18" height="16" rx="3"/><rect x="314" y="222" width="18" height="16" rx="3"/>
    <rect x="336" y="222" width="12" height="16" rx="3"/>
    <rect x="248" y="244" width="18" height="16" rx="3"/><rect x="270" y="244" width="18" height="16" rx="3"/>
    <rect x="292" y="244" width="18" height="16" rx="3"/><rect x="314" y="244" width="18" height="16" rx="3"/>
    <rect x="336" y="244" width="12" height="16" rx="3"/>
    <rect x="248" y="266" width="18" height="16" rx="3"/><rect x="270" y="266" width="18" height="16" rx="3"/>
    <rect x="292" y="266" width="18" height="16" rx="3"/><rect x="314" y="266" width="18" height="16" rx="3"/>
    <rect x="336" y="266" width="12" height="16" rx="3"/>
    <rect x="248" y="288" width="18" height="16" rx="3"/><rect x="270" y="288" width="18" height="16" rx="3"/>
    <rect x="292" y="288" width="18" height="16" rx="3"/><rect x="314" y="288" width="18" height="16" rx="3"/>
    <rect x="336" y="288" width="12" height="16" rx="3"/>
    <rect x="248" y="310" width="18" height="16" rx="3"/><rect x="270" y="310" width="18" height="16" rx="3"/>
    <rect x="292" y="310" width="18" height="16" rx="3"/><rect x="314" y="310" width="18" height="16" rx="3"/>
    <rect x="336" y="310" width="12" height="16" rx="3"/>
    <rect x="248" y="332" width="18" height="14" rx="3"/><rect x="270" y="332" width="18" height="14" rx="3"/>
    <rect x="292" y="332" width="18" height="14" rx="3"/><rect x="314" y="332" width="18" height="14" rx="3"/>
    <rect x="336" y="332" width="12" height="14" rx="3"/>
  </g>

  <text x="236" y="378" font-size="11.5" fill="#1a7f37" font-weight="600">device unmoved</text>

  <!-- ══════════ scenario B ══════════ -->
  <text x="468" y="106" font-size="14" font-weight="600" fill="#1f2328">Narrower, or any portrait window</text>
  <text x="468" y="126" font-size="12" fill="#59636e">No room beside it — panels go below.</text>

  <rect x="462" y="142" width="330" height="246" rx="9" fill="#f6f8fa" stroke="#d8dee4"/>

  <!-- device on top -->
  <rect x="572" y="154" width="112" height="94" rx="9" fill="#333333" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="581" y="163" width="94" height="26" rx="5" fill="#8fa87a" stroke="#6e8a5a" stroke-width="2"/>
  <text x="667" y="181" font-size="10.5" fill="#141e0c" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.00</text>
  <g fill="#4a4a4a" stroke="#2a2a2a">
    <rect x="581" y="197" width="17" height="11" rx="3"/><rect x="602" y="197" width="17" height="11" rx="3"/>
    <rect x="623" y="197" width="17" height="11" rx="3"/><rect x="644" y="197" width="17" height="11" rx="3"/>
    <rect x="581" y="213" width="17" height="11" rx="3"/><rect x="602" y="213" width="17" height="11" rx="3"/>
    <rect x="623" y="213" width="17" height="11" rx="3"/><rect x="644" y="213" width="17" height="11" rx="3"/>
    <rect x="581" y="229" width="17" height="11" rx="3"/><rect x="602" y="229" width="17" height="11" rx="3"/>
    <rect x="623" y="229" width="17" height="11" rx="3"/><rect x="644" y="229" width="17" height="11" rx="3"/>
  </g>

  <!-- panels below -->
  <rect x="572" y="262" width="112" height="46" rx="5" fill="#1e2e3a" stroke="#2d4556"/>
  <text x="581" y="278" font-size="9" fill="#f5c400" font-weight="700">TVM WORKSHEET</text>
  <rect x="581" y="284" width="43" height="11" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="630" y="284" width="43" height="11" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="581" y="298" width="43" height="11" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="630" y="298" width="43" height="11" rx="2" fill="#12202a" stroke="#2d4556"/>

  <rect x="572" y="316" width="112" height="34" rx="5" fill="#1e2e3a" stroke="#2d4556"/>
  <text x="581" y="331" font-size="9" fill="#f5c400" font-weight="700">STO — REGISTER</text>
  <rect x="581" y="336" width="22" height="10" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="607" y="336" width="22" height="10" rx="2" fill="#12202a" stroke="#2d4556"/>
  <rect x="633" y="336" width="22" height="10" rx="2" fill="#12202a" stroke="#2d4556"/>

  <text x="572" y="374" font-size="11.5" fill="#1a7f37" font-weight="600">device unmoved</text>

  <!-- ══════════ shared notes ══════════ -->
  <rect x="46" y="406" width="746" height="44" rx="7" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="62" y="426" font-size="12" fill="#1f2328">
    Panels stack in DOM order and never overlap — <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">openRegOverlay()</tspan> hides nothing, so TVM and STO/RCL can be open together.
  </text>
  <text x="62" y="443" font-size="12" fill="#59636e">
    The 1120px threshold is derived from the 420px device plus a 300px panel and its gap. Media queries, so it switches live on resize.
  </text>
</svg>
